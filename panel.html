<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SPIE North America HSE · Panel</title>

<!-- ═══════════════════════════════════════════════════════════════════════
     SPIE North America · HSE Reporting
     BLOQUE 11 · Panel de administración

     Un solo archivo, como la app. Las pestañas que ve cada persona salen de
     sus permisos en la base: este archivo no decide nada de eso, solo pinta
     lo que el servidor le dice que puede pintar.
     ═══════════════════════════════════════════════════════════════════════ -->

<style>
  :root {
    --azul:       #0f1e5a;
    --azul-claro: #1a2f7a;
    --rojo:       #e2001a;
    --gris:       #6b7280;
    --gris-claro: #f3f4f6;
    --linea:      #e5e7eb;
    --verde:      #15803d;
    --ambar:      #b45309;
    --blanco:     #ffffff;
    --radio:      12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro); color: #111827; font-size: 15px; line-height: 1.45;
  }

  header {
    background: var(--azul); color: var(--blanco);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 30;
  }
  header img { width: 34px; height: 34px; border-radius: 8px; }
  header .titulo { font-weight: 700; font-size: 15px; line-height: 1.2; }
  header .quien { font-size: 12.5px; opacity: .8; }
  header .crece { flex: 1; min-width: 0; }
  header button {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
    color: var(--blanco); border-radius: 999px; padding: 6px 14px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  header button:hover { background: rgba(255,255,255,.26); }

  .pestanas { background: var(--blanco); border-bottom: 2px solid var(--linea);
              display: flex; gap: 2px; padding: 0 20px; position: sticky; top: 58px; z-index: 25; }
  .pestana {
    padding: 13px 20px; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14.5px; font-weight: 700; color: var(--gris);
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .pestana.activa { color: var(--azul); border-bottom-color: var(--azul); }
  .pestana:hover { color: var(--azul); }

  main { padding: 22px 20px 50px; max-width: 1400px; margin: 0 auto; }
  .vista { display: none; }
  .vista.activa { display: block; }

  h1 { font-size: 21px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 22px 0 8px; }
  .sub { color: var(--gris); margin: 0 0 18px; font-size: 14px; }

  /* ── Filtros ──────────────────────────────────────────────────────────── */
  .filtros {
    background: var(--blanco); border: 2px solid var(--linea); border-radius: var(--radio);
    padding: 14px 16px; margin-bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 12px; font-weight: 700; color: var(--gris);
                 text-transform: uppercase; letter-spacing: .04em; }
  .campo input, .campo select {
    padding: 8px 10px; font-size: 14px; font-family: inherit;
    border: 2px solid var(--linea); border-radius: 9px; background: var(--blanco); color: inherit;
    min-width: 150px;
  }
  .campo input:focus, .campo select:focus { outline: none; border-color: var(--azul); }
  .filtros .crece { flex: 1; }

  .btn {
    padding: 9px 16px; border: none; border-radius: 9px;
    background: var(--azul); color: var(--blanco);
    font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .btn:hover { background: var(--azul-claro); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secundario { background: var(--blanco); color: var(--azul); border: 2px solid var(--azul); }
  .btn.peligro { background: var(--rojo); }
  .btn.chico { padding: 5px 11px; font-size: 13px; border-radius: 7px; }

  /* ── Tablas ───────────────────────────────────────────────────────────── */
  .caja-tabla { background: var(--blanco); border: 2px solid var(--linea);
                border-radius: var(--radio); overflow: auto; max-height: 62vh; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; background: var(--gris-claro); z-index: 2;
    text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 800;
    color: var(--gris); text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 2px solid var(--linea); white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clicable { cursor: pointer; }
  tbody tr.clicable:hover { background: #eef2ff; }
  .folio-cel { font-weight: 700; color: var(--azul); white-space: nowrap; }
  .recorte { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .etiqueta { display: inline-block; padding: 2px 9px; border-radius: 999px;
              font-size: 12px; font-weight: 700; white-space: nowrap; }
  .et-ok    { background: #dcfce7; color: var(--verde); }
  .et-mal   { background: #fee2e2; color: #991b1b; }
  .et-aviso { background: #fef3c7; color: var(--ambar); }
  .et-gris  { background: var(--gris-claro); color: var(--gris); }

  .cuenta { color: var(--gris); font-size: 13px; margin: 10px 2px; }
  .vacio { padding: 36px 20px; text-align: center; color: var(--gris); }

  /* ── Panel lateral de detalle ─────────────────────────────────────────── */
  .telon { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; }
  .telon.abierto { display: block; }
  .cajon {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 94vw);
    background: var(--blanco); z-index: 41; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s ease-out;
    box-shadow: -4px 0 24px rgba(0,0,0,.18);
  }
  .cajon.abierto { transform: none; }
  .cajon-cab {
    position: sticky; top: 0; background: var(--azul); color: var(--blanco);
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  }
  .cajon-cab .crece { flex: 1; }
  .cajon-cab button {
    background: rgba(255,255,255,.16); border: none; color: var(--blanco);
    width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  .cajon-cuerpo { padding: 18px 20px 40px; }
  .dato { padding: 9px 0; border-bottom: 1px solid var(--linea); }
  .dato:last-child { border-bottom: none; }
  .dato .etq { font-size: 11.5px; font-weight: 800; color: var(--gris);
               text-transform: uppercase; letter-spacing: .04em; }
  .dato .val { font-size: 14.5px; word-break: break-word; }

  .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
             gap: 10px; margin-top: 10px; }
  .galeria a { display: block; border: 2px solid var(--linea); border-radius: 10px;
               overflow: hidden; background: var(--gris-claro); }
  .galeria img { width: 100%; height: 118px; object-fit: cover; display: block; }
  .galeria .pie { padding: 5px 8px; font-size: 11.5px; color: var(--gris); }

  .resp { display: flex; align-items: center; gap: 10px; padding: 7px 0;
          border-bottom: 1px solid var(--linea); font-size: 14px; }
  .resp .txt { flex: 1; }
  .seccion-tit { font-size: 12px; font-weight: 800; color: var(--azul);
                 text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 2px; }

  /* ── Acceso ───────────────────────────────────────────────────────────── */
  .acceso { max-width: 380px; margin: 9vh auto; background: var(--blanco);
            border: 2px solid var(--linea); border-radius: 16px; padding: 30px 28px; }
  .acceso img { width: 52px; height: 52px; border-radius: 11px; display: block; margin: 0 auto 16px; }
  .acceso h1 { text-align: center; margin-bottom: 20px; }
  .acceso label { display: block; font-weight: 700; margin: 14px 0 6px; font-size: 14px; }
  .acceso input { width: 100%; padding: 12px; font-size: 15px; font-family: inherit;
                  border: 2px solid var(--linea); border-radius: 10px; }
  .acceso input:focus { outline: none; border-color: var(--azul); }
  .acceso .btn { width: 100%; margin-top: 20px; padding: 13px; font-size: 15px; }

  .error { display: none; background: #fee2e2; color: #991b1b; border-radius: 10px;
           padding: 11px 14px; margin-top: 14px; font-size: 14px; font-weight: 600; }
  .error.visible { display: block; }
  .ok-aviso { display: none; background: #dcfce7; color: #14532d; border-radius: 10px;
              padding: 11px 14px; margin: 14px 0; font-size: 14px; font-weight: 600; }
  .ok-aviso.visible { display: block; }

  /* ── Formulario de alta ───────────────────────────────────────────────── */
  .alta { background: var(--blanco); border: 2px solid var(--linea);
          border-radius: var(--radio); padding: 18px 20px; margin-bottom: 18px; display: none; }
  .alta.abierta { display: block; }
  .alta .fila { display: flex; flex-wrap: wrap; gap: 14px; }
  .alta .campo { flex: 1; min-width: 190px; }
  .alta .campo input, .alta .campo select { width: 100%; }

  .cargando { padding: 30px; text-align: center; color: var(--gris); }
</style>
</head>

<!-- ══ Acceso ═══════════════════════════════════════════════════════════ -->
<section id="p-acceso">
  <div class="acceso">
    <img src="./icon-192.png" alt="SPIE">
    <h1 data-t="acceso_titulo"></h1>
    <label for="a-usuario" data-t="acceso_usuario"></label>
    <input type="text" id="a-usuario" autocomplete="username" autocapitalize="none">
    <label for="a-clave" data-t="acceso_clave"></label>
    <input type="password" id="a-clave" autocomplete="current-password">
    <div class="error" id="a-error"></div>
    <button class="btn" id="a-btn" onclick="entrar()" data-t="acceso_btn"></button>
  </div>
</section>

<!-- ══ Panel ════════════════════════════════════════════════════════════ -->
<div id="p-panel" style="display:none">
  <header>
    <img src="./icon-192.png" alt="SPIE">

      <div class="quien" id="cab-quien"></div>

    <button onclick="cambiarIdioma()" id="btn-idioma">EN</button>
    <button onclick="salir()" data-t="salir"></button>

  <nav class="pestanas" id="pestanas"></nav>

  <main>
    <!-- ── Observaciones de HSE ── -->
    <section class="vista" id="v-hse">
      <h1 data-t="hse_titulo"></h1>
      <p class="sub" data-t="hse_sub"></p>

      <div class="filtros">
        <div class="campo"><label data-t="f_desde"></label>
          <input type="date" id="h-desde" onchange="pintarHse()"></div>
        <div class="campo"><label data-t="f_hasta"></label>
          <input type="date" id="h-hasta" onchange="pintarHse()"></div>
        <div class="campo"><label data-t="f_pais"></label>
          <select id="h-pais" onchange="pintarHse()"></select></div>
        <div class="campo"><label data-t="f_sitio"></label>
          <select id="h-sitio" onchange="pintarHse()"></select></div>
        <div class="campo"><label data-t="f_clasificacion"></label>
          <select id="h-clasif" onchange="pintarHse()"></select></div>
        <div class="campo crece"><label data-t="f_buscar"></label>
          <input type="text" id="h-busca" oninput="pintarHse()"></div>
        <button class="btn secundario" onclick="limpiarFiltrosHse()" data-t="f_limpiar"></button>
        <button class="btn" id="h-exportar" onclick="exportar('hse')" data-t="f_exportar"></button>
      </div>

      <div class="cuenta" id="h-cuenta"></div>
      <div class="caja-tabla"><table id="h-tabla"></table></div>
    </section>

    <!-- ── Inspecciones de vehículo ── -->
    <section class="vista" id="v-vehicle">
      <h1 data-t="veh_titulo"></h1>
      <p class="sub" data-t="veh_sub"></p>

      <div class="filtros">
        <div class="campo"><label data-t="f_desde"></label>
          <input type="date" id="v-desde" onchange="pintarVeh()"></div>
        <div class="campo"><label data-t="f_hasta"></label>
          <input type="date" id="v-hasta" onchange="pintarVeh()"></div>
        <div class="campo"><label data-t="f_pais"></label>
          <select id="v-pais" onchange="pintarVeh()"></select></div>
        <div class="campo"><label data-t="f_sitio"></label>
          <select id="v-sitio" onchange="pintarVeh()"></select></div>
        <div class="campo"><label data-t="f_estado_veh"></label>
          <select id="v-def" onchange="pintarVeh()"></select></div>
        <div class="campo crece"><label data-t="f_buscar"></label>
          <input type="text" id="v-busca" oninput="pintarVeh()"></div>
        <button class="btn secundario" onclick="limpiarFiltrosVeh()" data-t="f_limpiar"></button>
        <button class="btn" id="v-exportar" onclick="exportar('vehicle')" data-t="f_exportar"></button>
      </div>

      <div class="cuenta" id="v-cuenta"></div>
      <div class="caja-tabla"><table id="v-tabla"></table></div>
    </section>

    <!-- ── Empleados ── -->
    <section class="vista" id="v-employees">
      <h1 data-t="emp_titulo"></h1>
      <p class="sub" data-t="emp_sub"></p>

      <div class="ok-aviso" id="e-aviso"></div>

      <div class="alta" id="e-alta">
        <h2 style="margin-top:0" data-t="emp_alta_titulo"></h2>
        <div class="fila">
          <div class="campo"><label data-t="emp_nombre"></label>
            <input type="text" id="e-nombre" autocomplete="off"></div>
          <div class="campo"><label data-t="emp_departamento"></label>
            <select id="e-depto"></select></div>
          <div class="campo"><label data-t="emp_ubicacion"></label>
            <select id="e-ubic" onchange="alCambiarUbicacion()"></select></div>
          <div class="campo" id="e-pais-caja"><label data-t="emp_pais"></label>
            <select id="e-pais"></select></div>
        </div>
        <div class="error" id="e-error"></div>
        <div style="margin-top:16px; display:flex; gap:10px">
          <button class="btn" id="e-guardar" onclick="darDeAlta()" data-t="emp_guardar"></button>
          <button class="btn secundario" onclick="cerrarAlta()" data-t="cancelar"></button>
        </div>
      </div>

      <div class="filtros">
        <div class="campo"><label data-t="f_estado"></label>
          <select id="e-estado" onchange="cargarEmpleados()"></select></div>
        <div class="campo crece"><label data-t="f_buscar_emp"></label>
          <input type="text" id="e-busca" oninput="pintarEmpleados()"></div>
        <button class="btn" id="e-nueva" onclick="abrirAlta()" data-t="emp_nueva"></button>
        <button class="btn secundario" onclick="exportar('employees')" data-t="f_exportar"></button>
      </div>

      <div class="cuenta" id="e-cuenta"></div>
      <div class="caja-tabla"><table id="e-tabla"></table></div>
    </section>
  </main>
</div>

<div class="telon" id="telon" onclick="cerrarCajon()"></div>
<aside class="cajon" id="cajon">
  <div class="cajon-cab">
    <div class="crece">
      <div style="font-size:12px; opacity:.8" id="cajon-tipo"></div>
      <div style="font-weight:700; font-size:17px" id="cajon-folio"></div>
    </div>
    <button onclick="cerrarCajon()">×</button>
  </div>
  <div class="cajon-cuerpo" id="cajon-cuerpo"></div>
</aside>

let TOKEN = sessionStorage.getItem('panel_token') || null;

function texto(v) { return (v === null || v === undefined) ? '' : String(v); }

function pintarTextos() {
  document.documentElement.lang = IDIOMA;
  document.querySelectorAll('[data-t]').forEach((el) => {
    el.textContent = t(el.getAttribute('data-t'));
  });
  const b = document.getElementById('btn-idioma');
  if (b) b.textContent = (IDIOMA === 'es') ? 'EN' : 'ES';
}

function cambiarIdioma() {
  IDIOMA = (IDIOMA === 'es') ? 'en' : 'es';
  sessionStorage.setItem('panel_idioma', IDIOMA);
  pintarTextos();
  if (TOKEN) {
    pintarPestanas();
    prepararFiltros();
    cargarTodo();
  }
}

// 4 · LLAMADAS
// ══════════════════════════════════════════════════════════════════════════

async function api(accion, extra) {
  const cuerpo = Object.assign({ action: accion, lang: IDIOMA }, extra || {});
  if (TOKEN) cuerpo.token = TOKEN;

  const r = await fetch(API, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': CONFIG.ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.ANON_KEY,
    },
    body: JSON.stringify(cuerpo),
  });

  let datos = null;
  try { datos = await r.json(); } catch (e) { datos = null; }

  if (!datos || typeof datos !== 'object') {
    const e = new Error('respuesta-ilegible');
    e.http = r.status;
    throw e;
  }
  datos.__http = r.status;

  // Una sesión caducada no es un error cualquiera: hay que volver al acceso
  // en vez de dejar la pantalla con datos viejos que ya no se pueden refrescar.
  if (r.status === 401 && TOKEN) {
    cerrarSesionLocal();
    mostrarErrorAcceso(t('err_sesion'));
    throw new Error('sesion');
  }
  return datos;
}

function detalleServidor(r) {
  const msg = r && (r.error || r.message);
  const http = r && r.__http ? 'HTTP ' + r.__http : '';
  if (msg && http) return http + ' · ' + msg;
  return msg || http || '';
}

function mostrarErrorAcceso(texto) {
  const c = document.getElementById('a-error');
  c.textContent = texto;
  c.classList.add('visible');
}

async function entrar() {
  const usuario = (document.getElementById('a-usuario').value || '').trim();
  const clave = document.getElementById('a-clave').value || '';
  document.getElementById('a-error').classList.remove('visible');

  if (!usuario || !clave) { mostrarErrorAcceso(t('err_incompleto')); return; }

  const boton = document.getElementById('a-btn');
  boton.disabled = true;
  boton.textContent = t('entrando');

  try {
    const r = await api('login', { username: usuario, password: clave });

    if (!r.ok) {
      if (r.motivo === 'BLOQUEADO')      mostrarErrorAcceso(t('err_bloqueado'));
      else if (r.motivo === 'INACTIVO')  mostrarErrorAcceso(t('err_inactivo'));
      else if (r.motivo === 'NO_COINCIDE') mostrarErrorAcceso(t('err_no_coincide'));
      else mostrarErrorAcceso(t('err_servidor') + ' ' + detalleServidor(r));
      return;
    }

    TOKEN = r.token;
    USUARIO = r.usuario;
    MENU = r.menu || [];
    sessionStorage.setItem('panel_token', TOKEN);
    sessionStorage.setItem('panel_usuario', JSON.stringify(USUARIO));
    sessionStorage.setItem('panel_menu', JSON.stringify(MENU));

    if (USUARIO.lang && TEXTOS[USUARIO.lang] && !sessionStorage.getItem('panel_idioma')) {
      IDIOMA = USUARIO.lang;
      pintarTextos();
    }

    document.getElementById('a-clave').value = '';
    abrirPanel();
  } catch (e) {
    if (e.message !== 'sesion') mostrarErrorAcceso(t('err_servidor') + ' ' + (e.message || ''));
  } finally {
    boton.disabled = false;
    boton.textContent = t('acceso_btn');
  }
}

function cerrarSesionLocal() {
  TOKEN = null; USUARIO = null; MENU = []; VISTA = null;
  HSE = []; VEH = []; EMP = [];
  sessionStorage.removeItem('panel_token');
  sessionStorage.removeItem('panel_usuario');
  sessionStorage.removeItem('panel_menu');
  document.getElementById('p-panel').style.display = 'none';
  document.getElementById('p-acceso').style.display = '';
}

async function salir() {
  const token = TOKEN;
  cerrarSesionLocal();
  try {
    TOKEN = token;
    await api('logout', {});
  } catch (e) { /* salir nunca debe fallar en la cara del usuario */ }
  TOKEN = null;
}

function abrirPanel() {
  document.getElementById('p-acceso').style.display = 'none';
  document.getElementById('p-panel').style.display = '';
  document.getElementById('cab-quien').textContent =
    USUARIO.full_name + ' · ' + USUARIO.username;
  pintarPestanas();
  cargarTodo();
}

// Si algún día se añade un módulo nuevo en la base y aquí no hay traducción,
// se usa el nombre que mandó el servidor en vez de dejar la pestaña en blanco.
function nombreModulo(m) {
  const clave = 'mod_' + m.module_key;
  const d = TEXTOS[IDIOMA] || {};
  return d[clave] || TEXTOS.en[clave] || m.nombre || m.module_key;
}

function pintarPestanas() {
  const cont = document.getElementById('pestanas');
  cont.innerHTML = '';

  MENU.forEach((m) => {
    const b = document.createElement('button');
    b.className = 'pestana' + (VISTA === m.module_key ? ' activa' : '');
    // El nombre sale del diccionario de ESTE archivo, no del que mandó el
    // servidor al entrar: si no, al cambiar de idioma la pestaña se quedaba
    // con el nombre viejo hasta volver a entrar.
    b.textContent = nombreModulo(m);
    b.onclick = () => irA(m.module_key);
    cont.appendChild(b);
  });

  if (!VISTA && MENU.length > 0) VISTA = MENU[0].module_key;
  irA(VISTA);
}

function irA(clave) {
  VISTA = clave;
  document.querySelectorAll('.vista').forEach((v) => v.classList.remove('activa'));
  const v = document.getElementById('v-' + clave);
  if (v) v.classList.add('activa');

  document.querySelectorAll('.pestana').forEach((b, i) => {
    b.classList.toggle('activa', MENU[i] && MENU[i].module_key === clave);
  });
}

function puede(modulo, accion) {
  const m = MENU.find((x) => x.module_key === modulo);
  if (!m) return false;
  return accion === 'edit' ? m.can_edit : (accion === 'export' ? m.can_export : m.can_view);
}

async function cargarTodo() {
  try {
    if (!CATALOGOS) {
      const c = await api('ubicaciones', {});
      if (c.ok) CATALOGOS = c;
    }
    prepararFiltros();

    if (puede('hse'))       { const r = await api('hse-lista', {});      if (r.ok) HSE = r.filas; }
    if (puede('vehicle'))   { const r = await api('vehiculo-lista', {}); if (r.ok) VEH = r.filas; }
    if (puede('employees')) await cargarEmpleados();

    pintarHse();
    pintarVeh();
  } catch (e) { /* la sesión caducada ya se gestionó en api() */ }
}

function opcion(valor, etiqueta) {
  const o = document.createElement('option');
  o.value = valor;
  o.textContent = etiqueta;
  return o;
}

function llenar(id, items, primera) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const antes = sel.value;
  sel.innerHTML = '';
  sel.appendChild(opcion('', primera));
  items.forEach((x) => sel.appendChild(opcion(x.valor, x.etiqueta)));
  sel.value = antes;
}

function prepararFiltros() {
  const paises = (CATALOGOS && CATALOGOS.paises) || [];
  const ubic   = (CATALOGOS && CATALOGOS.ubicaciones) || [];
  const parques = ubic.filter((u) => u.kind === 'park');

  const comoPais = paises.map((p) => ({
    valor: (IDIOMA === 'es' ? p.name_es : p.name_en),
    etiqueta: (IDIOMA === 'es' ? p.name_es : p.name_en),
  }));
  const comoSitio = parques.map((s) => ({ valor: s.name, etiqueta: s.name }));

  llenar('h-pais', comoPais, t('f_todos'));
  llenar('v-pais', comoPais, t('f_todos'));
  llenar('h-sitio', comoSitio, t('f_todos'));
  llenar('v-sitio', comoSitio, t('f_todos'));

  // Las clasificaciones salen de los propios datos: así siempre coinciden con
  // lo que hay en la tabla, aunque mañana se añada una nueva en la base.
  const clases = [];
  HSE.forEach((f) => { if (f.classification && clases.indexOf(f.classification) === -1) clases.push(f.classification); });
  clases.sort();
  llenar('h-clasif', clases.map((c) => ({ valor: c, etiqueta: c })), t('f_todas'));

  const selDef = document.getElementById('v-def');
  if (selDef && selDef.options.length === 0) {
    selDef.appendChild(opcion('', t('f_todas')));
    selDef.appendChild(opcion('con', t('v_con_def')));
    selDef.appendChild(opcion('sin', t('v_sin_def')));
  }

  const selEstado = document.getElementById('e-estado');
  if (selEstado) {
    const antes = selEstado.value || 'activos';
    selEstado.innerHTML = '';
    [['activos', t('e_activos')], ['bajas', t('e_bajas')],
     ['bloqueados', t('e_bloqueados')], ['todos', t('e_todos')]]
      .forEach((p) => selEstado.appendChild(opcion(p[0], p[1])));
    selEstado.value = antes;
  }

  // Formulario de alta
  const deptos = (CATALOGOS && CATALOGOS.departamentos) || [];
  const selD = document.getElementById('e-depto');
  if (selD) {
    const antes = selD.value;
    selD.innerHTML = '';
    selD.appendChild(opcion('', '—'));
    deptos.forEach((d) => selD.appendChild(opcion(d.code, d.label)));
    selD.value = antes;
  }
  const selU = document.getElementById('e-ubic');
  if (selU) {
    const antes = selU.value;
    selU.innerHTML = '';
    selU.appendChild(opcion('', t('emp_sin_ubicacion')));
    ubic.forEach((u) => selU.appendChild(
      opcion(u.id, u.name + (u.kind === 'office' ? ' ·' : ''))));
    selU.value = antes;
  }
  const selP = document.getElementById('e-pais');
  if (selP) {
    const antes = selP.value;
    selP.innerHTML = '';
    selP.appendChild(opcion('', '—'));
    paises.forEach((p) => selP.appendChild(
      opcion(p.code, IDIOMA === 'es' ? p.name_es : p.name_en)));
    selP.value = antes;
  }
  alCambiarUbicacion();
}

// 8 · OBSERVACIONES DE HSE
// ══════════════════════════════════════════════════════════════════════════

function valor(id) { const e = document.getElementById(id); return e ? (e.value || '') : ''; }

function filtradasHse() {
  const desde = valor('h-desde'), hasta = valor('h-hasta');
  const pais = valor('h-pais'), sitio = valor('h-sitio'), clasif = valor('h-clasif');
  const busca = valor('h-busca').trim().toLowerCase();

  return HSE.filter((f) => {
    if (desde && texto(f.occurred_date) < desde) return false;
    if (hasta && texto(f.occurred_date) > hasta) return false;
    if (pais && f.country !== pais) return false;
    if (sitio && f.site !== sitio) return false;
    if (clasif && f.classification !== clasif) return false;
    if (busca) {
      const todo = [f.report_code, f.reporter_name, f.description, f.hazard_item, f.site]
        .map(texto).join(' ').toLowerCase();
      if (todo.indexOf(busca) === -1) return false;
    }
    return true;
  });
}

function limpiarFiltrosHse() {
  ['h-desde','h-hasta','h-pais','h-sitio','h-clasif','h-busca'].forEach((id) => {
    const e = document.getElementById(id); if (e) e.value = '';
  });
  pintarHse();
}

function celda(texto_, clase) {
  const td = document.createElement('td');
  td.textContent = texto(texto_);
  if (clase) td.className = clase;
  return td;
}

function pintarHse() {
  const filas = filtradasHse();
  const tabla = document.getElementById('h-tabla');
  if (!tabla) return;
  tabla.innerHTML = '';

  document.getElementById('h-cuenta').textContent =
    t('n_reportes').replace('{n}', filas.length).replace('{total}', HSE.length);

  if (filas.length === 0) {
    const d = document.createElement('tbody');
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.className = 'vacio'; td.colSpan = 8; td.textContent = t('sin_datos');
    tr.appendChild(td); d.appendChild(tr); tabla.appendChild(d);
    return;
  }

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  [t('t_folio'), t('t_fecha'), t('t_persona'), t('t_sitio'), t('t_clasificacion'),
   t('t_peligro'), t('t_descripcion'), t('t_fotos')].forEach((h) => {
    const th = document.createElement('th'); th.textContent = h; trh.appendChild(th);
  });
  thead.appendChild(trh); tabla.appendChild(thead);

  const tb = document.createElement('tbody');
  filas.forEach((f) => {
    const tr = document.createElement('tr');
    tr.className = 'clicable';
    tr.onclick = () => abrirDetalleHse(f);
    tr.appendChild(celda(f.report_code, 'folio-cel'));
    tr.appendChild(celda(f.occurred_date));
    tr.appendChild(celda(f.reporter_name));
    tr.appendChild(celda(f.site));
    tr.appendChild(celda(f.classification));
    tr.appendChild(celda(f.hazard_item || f.hazard_category));
    tr.appendChild(celda(f.description, 'recorte'));
    tr.appendChild(celda(f.archivos || 0));
    tb.appendChild(tr);
  });
  tabla.appendChild(tb);
}

function filtradasVeh() {
  const desde = valor('v-desde'), hasta = valor('v-hasta');
  const pais = valor('v-pais'), sitio = valor('v-sitio'), def = valor('v-def');
  const busca = valor('v-busca').trim().toLowerCase();

  return VEH.filter((f) => {
    if (desde && texto(f.inspection_date) < desde) return false;
    if (hasta && texto(f.inspection_date) > hasta) return false;
    if (pais && f.country !== pais) return false;
    if (sitio && f.site !== sitio) return false;
    if (def === 'con' && !(f.deficiencies > 0)) return false;
    if (def === 'sin' && f.deficiencies > 0) return false;
    if (busca) {
      const todo = [f.report_code, f.driver_name, f.license_plate, f.site]
        .map(texto).join(' ').toLowerCase();
      if (todo.indexOf(busca) === -1) return false;
    }
    return true;
  });
}

function limpiarFiltrosVeh() {
  ['v-desde','v-hasta','v-pais','v-sitio','v-def','v-busca'].forEach((id) => {
    const e = document.getElementById(id); if (e) e.value = '';
  });
  pintarVeh();
}

function pintarVeh() {
  const filas = filtradasVeh();
  const tabla = document.getElementById('v-tabla');
  if (!tabla) return;
  tabla.innerHTML = '';

  document.getElementById('v-cuenta').textContent =
    t('n_reportes').replace('{n}', filas.length).replace('{total}', VEH.length);

  if (filas.length === 0) {
    const d = document.createElement('tbody');
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.className = 'vacio'; td.colSpan = 8; td.textContent = t('sin_datos');
    tr.appendChild(td); d.appendChild(tr); tabla.appendChild(d);
    return;
  }

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  [t('t_folio'), t('t_fecha'), t('t_conductor'), t('t_placa'), t('t_sitio'),
   t('t_odometro'), t('t_deficiencias'), t('t_fotos')].forEach((h) => {
    const th = document.createElement('th'); th.textContent = h; trh.appendChild(th);
  });
  thead.appendChild(trh); tabla.appendChild(thead);

  const tb = document.createElement('tbody');
  filas.forEach((f) => {
    const tr = document.createElement('tr');
    tr.className = 'clicable';
    tr.onclick = () => abrirDetalleVeh(f);
    tr.appendChild(celda(f.report_code, 'folio-cel'));
    tr.appendChild(celda(f.inspection_date));
    tr.appendChild(celda(f.driver_name));
    tr.appendChild(celda(f.license_plate));
    tr.appendChild(celda(f.site));
    tr.appendChild(celda(f.odometer));

    const td = document.createElement('td');
    const et = document.createElement('span');
    et.className = 'etiqueta ' + (f.deficiencies > 0 ? 'et-mal' : 'et-ok');
    et.textContent = f.deficiencies;
    td.appendChild(et);
    tr.appendChild(td);

    tr.appendChild(celda(f.fotos || 0));
    tb.appendChild(tr);
  });
  tabla.appendChild(tb);
}

function cerrarCajon() {
  document.getElementById('cajon').classList.remove('abierto');
  document.getElementById('telon').classList.remove('abierto');
}

function abrirCajon(tipo, folio) {
  document.getElementById('cajon-tipo').textContent = tipo;
  document.getElementById('cajon-folio').textContent = folio;
  document.getElementById('cajon-cuerpo').innerHTML =
    '<div class="cargando">' + t('cargando') + '</div>';
  document.getElementById('cajon').classList.add('abierto');
  document.getElementById('telon').classList.add('abierto');
}

function dato(etq, val) {
  const d = document.createElement('div');
  d.className = 'dato';
  const e = document.createElement('div'); e.className = 'etq'; e.textContent = etq;
  const v = document.createElement('div'); v.className = 'val'; v.textContent = texto(val) || '—';
  d.appendChild(e); d.appendChild(v);
  return d;
}

async function abrirDetalleHse(f) {
  abrirCajon(t('detalle_hse'), f.report_code);
  const c = document.getElementById('cajon-cuerpo');
  c.innerHTML = '';

  [[t('t_fecha'), texto(f.occurred_date) + ' ' + texto(f.occurred_time)],
   [t('t_persona'), f.reporter_name],
   [t('t_departamento'), f.department],
   [t('t_pais'), f.country],
   [t('t_sitio'), f.site],
   [t('t_cliente'), f.customer],
   [t('t_clasificacion'), f.classification],
   [t('t_peligro'), texto(f.hazard_category) + (f.hazard_item ? ' → ' + f.hazard_item : '')],
   [t('t_acciones_tomadas'), f.actions],
   [t('t_descripcion'), f.description],
  ].forEach((p) => c.appendChild(dato(p[0], p[1])));

  await pintarFotos(c, f.report_code);
}

async function abrirDetalleVeh(f) {
  abrirCajon(t('detalle_veh'), f.report_code);
  const c = document.getElementById('cajon-cuerpo');
  c.innerHTML = '';

  [[t('t_fecha'), f.inspection_date],
   [t('t_conductor'), f.driver_name],
   [t('t_placa'), f.license_plate],
   [t('t_odometro'), f.odometer],
   [t('t_pais'), f.country],
   [t('t_sitio'), f.site],
   [t('t_deficiencias'), f.deficiencies],
  ].forEach((p) => c.appendChild(dato(p[0], p[1])));

  try {
    const r = await api('vehiculo-detalle', { report_code: f.report_code });
    if (r.ok) {
      let seccion = null;
      (r.respuestas || []).forEach((q) => {
        if (q.seccion !== seccion) {
          seccion = q.seccion;
          const h = document.createElement('div');
          h.className = 'seccion-tit';
          h.textContent = seccion;
          c.appendChild(h);
        }
        const d = document.createElement('div');
        d.className = 'resp';
        const et = document.createElement('span');
        et.className = 'etiqueta ' + (q.es_deficiencia ? 'et-mal' : 'et-ok');
        et.textContent = q.respuesta ? t('v_si') : t('v_no');
        const tx = document.createElement('span');
        tx.className = 'txt';
        tx.textContent = q.pregunta;
        d.appendChild(et); d.appendChild(tx);
        c.appendChild(d);
      });
    }
  } catch (e) { /* ya gestionado */ }

  await pintarFotos(c, f.report_code);
}

async function pintarFotos(cont, folio) {
  const h = document.createElement('h2');
  h.textContent = t('t_fotos');
  cont.appendChild(h);

  const espera = document.createElement('div');
  espera.className = 'cargando';
  espera.textContent = t('cargando');
  cont.appendChild(espera);

  try {
    const r = await api('archivos', { report_code: folio });
    espera.remove();

    if (!r.ok || !r.archivos || r.archivos.length === 0) {
      const p = document.createElement('div');
      p.className = 'vacio';
      p.textContent = t('sin_fotos');
      cont.appendChild(p);
      return;
    }

    const g = document.createElement('div');
    g.className = 'galeria';
    r.archivos.forEach((a) => {
      const enlace = document.createElement('a');
      enlace.href = a.url || '#';
      enlace.target = '_blank';
      enlace.rel = 'noopener';
      const img = document.createElement('img');
      img.src = a.url || '';
      img.alt = a.file_name;
      img.loading = 'lazy';
      const pie = document.createElement('div');
      pie.className = 'pie';
      pie.textContent = a.slot ? a.slot.replace('PHOTO_', '') : a.file_name;
      enlace.appendChild(img);
      enlace.appendChild(pie);
      g.appendChild(enlace);
    });
    cont.appendChild(g);

    const nota = document.createElement('div');
    nota.className = 'cuenta';
    nota.textContent = t('fotos_caducan');
    cont.appendChild(nota);
  } catch (e) {
    espera.remove();
  }
}

async function cargarEmpleados() {
  try {
    const r = await api('empleados', { estado: valor('e-estado') || 'activos' });
    if (r.ok) EMP = r.filas;
    pintarEmpleados();
  } catch (e) { /* ya gestionado */ }
}

function pintarEmpleados() {
  const busca = valor('e-busca').trim().toLowerCase();
  const filas = EMP.filter((e) => {
    if (!busca) return true;
    return (texto(e.employee_no) + ' ' + texto(e.full_name)).toLowerCase().indexOf(busca) !== -1;
  });

  const tabla = document.getElementById('e-tabla');
  if (!tabla) return;
  tabla.innerHTML = '';

  document.getElementById('e-cuenta').textContent =
    t('n_empleados').replace('{n}', filas.length).replace('{total}', EMP.length);

  const puedeEditar = puede('employees', 'edit');

  if (filas.length === 0) {
    const d = document.createElement('tbody');
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.className = 'vacio'; td.colSpan = 7; td.textContent = t('sin_datos');
    tr.appendChild(td); d.appendChild(tr); tabla.appendChild(d);
    return;
  }

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  const cab = [t('t_numero'), t('t_nombre'), t('t_departamento'), t('t_ubicacion'),
               t('t_pais'), t('t_estado'), t('t_ultimo_acceso')];
  if (puedeEditar) cab.push(t('t_acciones'));
  cab.forEach((h) => { const th = document.createElement('th'); th.textContent = h; trh.appendChild(th); });
  thead.appendChild(trh); tabla.appendChild(thead);

  const tb = document.createElement('tbody');
  filas.forEach((e) => {
    const tr = document.createElement('tr');
    tr.appendChild(celda(e.employee_no, 'folio-cel'));
    tr.appendChild(celda(e.full_name));
    tr.appendChild(celda(e.department));
    tr.appendChild(celda(e.site));
    tr.appendChild(celda(e.country_code));

    const td = document.createElement('td');
    const et = document.createElement('span');
    if (!e.activo)        { et.className = 'etiqueta et-gris';  et.textContent = t('e_baja'); }
    else if (e.bloqueado) { et.className = 'etiqueta et-aviso'; et.textContent = t('e_bloqueado'); }
    else                  { et.className = 'etiqueta et-ok';    et.textContent = t('e_activo'); }
    td.appendChild(et);
    tr.appendChild(td);

    tr.appendChild(celda(e.ultimo_acceso ? texto(e.ultimo_acceso).slice(0, 16).replace('T', ' ') : '—'));

    if (puedeEditar) {
      const tdA = document.createElement('td');
      tdA.style.whiteSpace = 'nowrap';

      if (e.bloqueado) {
        const b = document.createElement('button');
        b.className = 'btn chico secundario';
        b.textContent = t('acc_desbloquear');
        b.onclick = () => desbloquear(e);
        tdA.appendChild(b);
      }

      const b2 = document.createElement('button');
      b2.className = 'btn chico ' + (e.activo ? 'peligro' : '');
      b2.style.marginLeft = e.bloqueado ? '6px' : '0';
      b2.textContent = e.activo ? t('acc_baja') : t('acc_reactivar');
      b2.onclick = () => cambiarActivo(e);
      tdA.appendChild(b2);

      tr.appendChild(tdA);
    }

    tb.appendChild(tr);
  });
  tabla.appendChild(tb);
}

function avisarEmpleados(texto_) {
  const c = document.getElementById('e-aviso');
  c.textContent = texto_;
  c.classList.add('visible');
  setTimeout(() => c.classList.remove('visible'), 8000);
}

async function desbloquear(e) {
  try {
    const r = await api('empleado-desbloquear', { employee_no: e.employee_no });
    if (r.ok) { avisarEmpleados(e.full_name + ' · ' + t('acc_desbloquear')); await cargarEmpleados(); }
  } catch (err) { /* ya gestionado */ }
}

async function cambiarActivo(e) {
  const pregunta = e.activo
    ? t('conf_baja').replace('{nombre}', e.full_name)
    : t('conf_reactivar').replace('{nombre}', e.full_name);
  if (!confirm(pregunta)) return;

  try {
    const r = await api('empleado-baja', { employee_no: e.employee_no, active: !e.activo });
    if (r.ok) { avisarEmpleados(e.full_name + ' · ' + (e.activo ? t('e_baja') : t('e_activo'))); await cargarEmpleados(); }
  } catch (err) { /* ya gestionado */ }
}

function abrirAlta() {
  document.getElementById('e-alta').classList.add('abierta');
  document.getElementById('e-nombre').value = '';
  document.getElementById('e-error').classList.remove('visible');
  document.getElementById('e-nombre').focus();
}

function cerrarAlta() {
  document.getElementById('e-alta').classList.remove('abierta');
}

// El país solo se pregunta cuando no hay ubicación: si la hay, el país es el
// de esa ubicación y preguntarlo otra vez solo serviría para contradecirse.
function alCambiarUbicacion() {
  const caja = document.getElementById('e-pais-caja');
  if (!caja) return;
  caja.style.display = valor('e-ubic') ? 'none' : '';
}

async function darDeAlta() {
  const err = document.getElementById('e-error');
  err.classList.remove('visible');

  const nombre = (document.getElementById('e-nombre').value || '').trim();
  const depto = valor('e-depto');
  const ubic = valor('e-ubic');
  const pais = valor('e-pais');

  const fallar = (clave) => { err.textContent = t(clave); err.classList.add('visible'); };

  if (nombre.length < 3) return fallar('emp_err_nombre');
  if (!depto) return fallar('emp_err_depto');
  if (!ubic && !pais) return fallar('emp_err_pais');

  const boton = document.getElementById('e-guardar');
  boton.disabled = true;

  try {
    const r = await api('empleado-alta', {
      full_name: nombre,
      department_code: depto,
      site_id: ubic || null,
      country_code: ubic ? null : pais,
    });

    if (!r.ok) { err.textContent = detalleServidor(r); err.classList.add('visible'); return; }

    avisarEmpleados(t('emp_creado')
      .replace('{nombre}', r.empleado.full_name)
      .replace('{numero}', r.empleado.employee_no));

    cerrarAlta();
    document.getElementById('e-estado').value = 'activos';
    await cargarEmpleados();
  } catch (e) {
    if (e.message !== 'sesion') { err.textContent = e.message || ''; err.classList.add('visible'); }
  } finally {
    boton.disabled = false;
  }
}

// 12 · EXPORTAR
//
// Se exporta lo que se está viendo, con los filtros puestos, no la tabla
// entera: si alguien filtró por un parque y un mes, eso es lo que quiere
// mandar por correo.
//
// Si la librería de Excel no cargó, se baja un CSV con marca de orden de
// bytes (BOM), que es lo que hace que Excel abra bien los acentos.
// ══════════════════════════════════════════════════════════════════════════

function datosParaExportar(que) {
  if (que === 'hse') {
    return filtradasHse().map((f) => {
      const o = {};
      o[t('t_folio')] = f.report_code;
      o[t('t_fecha')] = f.occurred_date;
      o[t('t_hora')] = f.occurred_time;
      o[t('t_persona')] = f.reporter_name;
      o[t('t_departamento')] = f.department;
      o[t('t_pais')] = f.country;
      o[t('t_sitio')] = f.site;
      o[t('t_cliente')] = f.customer;
      o[t('t_clasificacion')] = f.classification;
      o[t('t_peligro')] = texto(f.hazard_category) + (f.hazard_item ? ' / ' + f.hazard_item : '');
      o[t('t_acciones_tomadas')] = f.actions;
      o[t('t_descripcion')] = f.description;
      o[t('t_fotos')] = f.archivos;
      return o;
    });
  }
  if (que === 'vehicle') {
    return filtradasVeh().map((f) => {
      const o = {};
      o[t('t_folio')] = f.report_code;
      o[t('t_fecha')] = f.inspection_date;
      o[t('t_conductor')] = f.driver_name;
      o[t('t_placa')] = f.license_plate;
      o[t('t_odometro')] = f.odometer;
      o[t('t_pais')] = f.country;
      o[t('t_sitio')] = f.site;
      o[t('t_deficiencias')] = f.deficiencies;
      o[t('t_fotos')] = f.fotos;
      return o;
    });
  }
  const busca = valor('e-busca').trim().toLowerCase();
  return EMP.filter((e) => !busca ||
      (texto(e.employee_no) + ' ' + texto(e.full_name)).toLowerCase().indexOf(busca) !== -1)
    .map((e) => {
      const o = {};
      o[t('t_numero')] = e.employee_no;
      o[t('t_nombre')] = e.full_name;
      o[t('t_departamento')] = e.department;
      o[t('t_ubicacion')] = e.site;
      o[t('t_pais')] = e.country_code;
      o[t('t_estado')] = !e.activo ? t('e_baja') : (e.bloqueado ? t('e_bloqueado') : t('e_activo'));
      o[t('t_ultimo_acceso')] = e.ultimo_acceso;
      return o;
    });
}

function nombreArchivo(que) {
  const hoy = new Date().toISOString().slice(0, 10);
  const parte = que === 'hse' ? 'HSE' : (que === 'vehicle' ? 'Vehiculos' : 'Empleados');
  return 'SPIE-NA-' + parte + '-' + hoy;
}

function bajar(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function aCsv(filas) {
  if (filas.length === 0) return '';
  const cab = Object.keys(filas[0]);
  const escapar = (v) => {
    const s = texto(v);
    return (/[",\n;]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lineas = [cab.map(escapar).join(',')];
  filas.forEach((f) => lineas.push(cab.map((c) => escapar(f[c])).join(',')));
  return lineas.join('\r\n');
}

function exportar(que) {
  const filas = datosParaExportar(que);
  if (filas.length === 0) { alert(t('sin_datos')); return; }

  const nombre = nombreArchivo(que);

  if (window.XLSX) {
    const hoja = XLSX.utils.json_to_sheet(filas);
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, 'SPIE');
    XLSX.writeFile(libro, nombre + '.xlsx');
    return;
  }

  // El BOM es lo que hace que Excel entienda los acentos al abrir un CSV.
  const blob = new Blob(['﻿' + aCsv(filas)], { type: 'text/csv;charset=utf-8;' });
  bajar(blob, nombre + '.csv');
}

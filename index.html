<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1e5a">
<title>SPIE North America HSE</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- ═══════════════════════════════════════════════════════════════════════
     SPIE North America · HSE Reporting
     BLOQUE 8 · Base de la aplicación del empleado

     Un solo archivo, como la app de México. Aquí viven:
       · el selector de idioma
       · el acceso con número de 4 dígitos + nombre
       · la elección entre HSE Observation y Vehicle Inspection
       · el Service Worker y la cola sin señal

     Los dos formularios completos llegan en los bloques 9 y 10; su sitio
     está marcado más abajo.
     ═══════════════════════════════════════════════════════════════════════ -->

<style>
  :root {
    --azul:        #0f1e5a;
    --azul-claro:  #1a2f7a;
    --rojo:        #e2001a;
    --gris:        #6b7280;
    --gris-claro:  #f3f4f6;
    --linea:       #e5e7eb;
    --verde:       #15803d;
    --ambar:       #b45309;
    --blanco:      #ffffff;
    --radio:       14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: #111827;
    font-size: 17px;
    line-height: 1.45;
  }

  /* ── Cabecera ─────────────────────────────────────────────────────────── */
  header {
    background: var(--azul);
    color: var(--blanco);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header img { width: 38px; height: 38px; border-radius: 9px; flex: none; }
  header .titulo { font-weight: 700; font-size: 16px; line-height: 1.2; }
  header .quien { font-size: 13px; opacity: .8; }
  header .crece { flex: 1; min-width: 0; }

  .btn-idioma {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3);
    color: var(--blanco);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-idioma:active { background: rgba(255,255,255,.3); }

  /* ── Avisos de estado ─────────────────────────────────────────────────── */
  #barra-estado { display: none; padding: 9px 16px; font-size: 14px; font-weight: 600; text-align: center; }
  #barra-estado.sin-red { display: block; background: #fef3c7; color: var(--ambar); }
  #barra-estado.pendientes { display: block; background: #dbeafe; color: #1e40af; }

  /* ── Pantallas ────────────────────────────────────────────────────────── */
  main { padding: 20px 16px 40px; max-width: 560px; margin: 0 auto; }
  .pantalla { display: none; }
  .pantalla.activa { display: block; animation: aparecer .18s ease-out; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 23px; margin: 6px 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--gris); margin: 0 0 24px; font-size: 15px; }

  /* ── Botones ──────────────────────────────────────────────────────────── */
  .btn {
    display: block;
    width: 100%;
    padding: 16px 18px;
    border: none;
    border-radius: var(--radio);
    background: var(--azul);
    color: var(--blanco);
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .btn:active { background: var(--azul-claro); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secundario { background: var(--blanco); color: var(--azul); border: 2px solid var(--azul); }
  .btn.texto { background: none; color: var(--gris); font-weight: 600; font-size: 15px; padding: 10px; }

  /* Tarjetas grandes para elegir idioma y tipo de reporte */
  .tarjeta {
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    padding: 20px;
    background: var(--blanco);
    border: 2px solid var(--linea);
    border-radius: var(--radio);
    margin-bottom: 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 17px;
    color: inherit;
  }
  .tarjeta:active { border-color: var(--azul); background: #f8fafc; }
  .tarjeta .icono { font-size: 30px; line-height: 1; flex: none; }
  .tarjeta .nombre { font-weight: 700; }
  .tarjeta .detalle { color: var(--gris); font-size: 14px; }

  /* ── Formularios ──────────────────────────────────────────────────────── */
  label { display: block; font-weight: 700; margin: 18px 0 7px; font-size: 15px; }
  input[type=text], input[type=tel] {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-family: inherit;
    border: 2px solid var(--linea);
    border-radius: var(--radio);
    background: var(--blanco);
  }
  input:focus { outline: none; border-color: var(--azul); }
  #a-numero { letter-spacing: .35em; font-weight: 700; font-size: 26px; text-align: center; }

  .error {
    display: none;
    background: #fee2e2;
    color: #991b1b;
    border-radius: var(--radio);
    padding: 13px 15px;
    margin: 16px 0 0;
    font-size: 15px;
    font-weight: 600;
  }
  .error.visible { display: block; }

  .aviso {
    background: var(--blanco);
    border: 2px dashed var(--linea);
    border-radius: var(--radio);
    padding: 22px;
    text-align: center;
    color: var(--gris);
  }
  .aviso b { color: #111827; display: block; margin-bottom: 6px; font-size: 17px; }

  .pie { margin-top: 26px; text-align: center; color: var(--gris); font-size: 13px; }

  /* ── Formulario por pasos ─────────────────────────────────────────────── */
  .pasos { display: flex; gap: 6px; margin: 0 0 18px; }
  .pasos span { flex: 1; height: 5px; border-radius: 3px; background: var(--linea); }
  .pasos span.hecho { background: var(--azul); }

  .paso-de { color: var(--gris); font-size: 13px; font-weight: 700; text-transform: uppercase;
             letter-spacing: .05em; margin-bottom: 4px; }

  textarea, select, input[type=date], input[type=time], input[type=number] {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-family: inherit;
    border: 2px solid var(--linea);
    border-radius: var(--radio);
    background: var(--blanco);
    color: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, select:focus, input:focus { outline: none; border-color: var(--azul); }
  .obligatorio { color: var(--rojo); }
  .ayuda { color: var(--gris); font-size: 13px; margin-top: 6px; }

  /* Opción única: lista de botones grandes, más fáciles de dar con guante */
  .opciones { display: flex; flex-direction: column; gap: 9px; }
  .opcion {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 13px 15px;
    background: var(--blanco);
    border: 2px solid var(--linea);
    border-radius: var(--radio);
    cursor: pointer;
    font-size: 15.5px;
    text-align: left;
    font-family: inherit;
    color: inherit;
    line-height: 1.35;
  }
  .opcion .marca {
    width: 21px; height: 21px; border-radius: 50%;
    border: 2px solid var(--gris); flex: none; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
  }
  .opcion.multiple .marca { border-radius: 6px; }
  .opcion.elegida { border-color: var(--azul); background: #eef2ff; }
  .opcion.elegida .marca { border-color: var(--azul); background: var(--azul); }
  .opcion.elegida .marca::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }

  /* Fotos */
  .fotos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  .foto {
    position: relative; border-radius: var(--radio); overflow: hidden;
    border: 2px solid var(--linea); background: var(--blanco); aspect-ratio: 4/3;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto button {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.65); color: #fff;
    font-size: 16px; line-height: 1; cursor: pointer;
  }
  .botones-foto { display: flex; gap: 10px; margin-top: 12px; }
  .botones-foto .btn { margin: 0; flex: 1; font-size: 15px; padding: 14px 10px; }
  input[type=file] { display: none; }

  /* Resumen y confirmación */
  .resumen { background: var(--blanco); border: 2px solid var(--linea); border-radius: var(--radio); padding: 4px 16px; }
  .resumen .fila { padding: 11px 0; border-bottom: 1px solid var(--linea); }
  .resumen .fila:last-child { border-bottom: none; }
  .resumen .etq { color: var(--gris); font-size: 13px; font-weight: 700; }
  .resumen .val { font-size: 15.5px; word-break: break-word; }

  .exito { text-align: center; padding: 26px 20px; }
  .exito .marca-ok {
    width: 74px; height: 74px; border-radius: 50%;
    background: #dcfce7; color: var(--verde);
    font-size: 40px; line-height: 74px; margin: 0 auto 16px;
  }
  .folio {
    font-size: 24px; font-weight: 800; color: var(--azul);
    letter-spacing: .02em; margin: 10px 0 4px;
  }
  .fila-botones { display: flex; gap: 10px; margin-top: 22px; }
  .fila-botones .btn { margin: 0; flex: 1; }


  /* ── Inspección de vehículo ───────────────────────────────────────────── */
  .veh-seccion {
    font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: var(--azul); margin: 22px 0 2px;
  }
  .pregunta { padding: 13px 0; border-bottom: 1px solid var(--linea); }
  .pregunta:last-child { border-bottom: none; }
  .pregunta-texto { font-size: 15px; line-height: 1.35; margin-bottom: 9px; }
  .pregunta-num { color: var(--gris); font-weight: 700; }
  .sino { display: flex; gap: 9px; }
  .sino-btn {
    flex: 1; padding: 11px 0; border-radius: 10px;
    border: 2px solid var(--azul); background: var(--blanco); color: var(--azul);
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .sino-btn.elegido { background: var(--azul); color: #fff; }
  .sino-btn.elegido.malo { background: var(--rojo); border-color: var(--rojo); }
  .foto-slot {
    position: relative; border-radius: var(--radio); overflow: hidden;
    border: 2px solid var(--linea); background: var(--blanco); aspect-ratio: 4/3; max-width: 260px;
  }
  .foto-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-slot button {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.65); color: #fff;
    font-size: 16px; line-height: 1; cursor: pointer;
  }
  .aviso-def {
    margin: 16px 0 0; padding: 12px 14px; border-radius: var(--radio);
    background: #fef3c7; border: 2px solid var(--ambar); color: #78350f;
    font-size: 14px; line-height: 1.4;
  }
  .aviso-ok {
    margin: 16px 0 0; padding: 12px 14px; border-radius: var(--radio);
    background: #dcfce7; border: 2px solid var(--verde); color: #14532d;
    font-size: 14px; font-weight: 600;
  }

  /* ── Acordeón de categorías de peligro ────────────────────────────────── */
  .acordeon {
    border: 2px solid var(--linea);
    border-radius: var(--radio);
    overflow: hidden;
    background: var(--blanco);
    margin-top: 8px;
  }
  .acor-fila {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px 14px;
    background: var(--blanco); border: none;
    border-bottom: 1px solid var(--linea);
    font-family: inherit; font-size: 16px; color: inherit;
    text-align: left; cursor: pointer;
  }
  .acor-fila:last-child { border-bottom: none; }
  .acor-fila.abierta { background: #eef2ff; }
  .acor-fila:active { background: #e6ebff; }

  .letra {
    width: 30px; height: 30px; flex: none;
    border-radius: 8px;
    background: var(--azul); color: var(--blanco);
    font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .acor-nombre { flex: 1; font-weight: 700; line-height: 1.25; }
  .acor-cuenta { color: var(--gris); font-size: 14px; font-weight: 700; }
  .acor-flecha { color: var(--gris); font-size: 12px; width: 13px; text-align: center; }
  .acor-fila.con-eleccion .acor-cuenta { color: var(--verde); }

  .acor-cuerpo {
    display: none;
    padding: 4px 14px 15px;
    background: #eef2ff;
    border-bottom: 1px solid var(--linea);
  }
  .acor-cuerpo.abierto { display: flex; flex-wrap: wrap; gap: 7px; }

  .chip {
    padding: 8px 13px;
    border-radius: 999px;
    border: 2px solid var(--azul);
    background: var(--blanco);
    color: var(--azul);
    font-size: 13.5px; font-family: inherit;
    line-height: 1.25; cursor: pointer;
  }
  .chip:active { background: #dbe3ff; }
  .chip.elegido { background: var(--azul); color: var(--blanco); }

  .elegido-caja {
    margin-top: 12px; padding: 12px 14px;
    background: #ecfdf5; border: 2px solid #a7f3d0;
    border-radius: var(--radio); font-size: 15px;
  }
  .elegido-caja b { display: block; font-size: 12.5px; color: var(--verde);
                    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
</style>
</head>

<body>

<header>
  <img src="./icon-192.png" alt="SPIE">
  <div class="crece">
    <div class="titulo">SPIE North America HSE</div>
    <div class="quien" id="cabecera-quien"></div>
  </div>
  <button class="btn-idioma" id="btn-idioma" onclick="cambiarIdioma()" style="display:none">EN</button>
</header>

<div id="barra-estado"></div>

<main>

  <!-- ══ 1 · Elegir idioma ══════════════════════════════════════════════ -->
  <section class="pantalla" id="p-idioma">
    <h1>Language · Idioma</h1>
    <p class="sub">Choose your language · Elige tu idioma</p>

    <button class="tarjeta" onclick="elegirIdioma('es')">
      <span class="icono">🇲🇽</span>
      <span><span class="nombre">Español</span><br><span class="detalle">Continuar en español</span></span>
    </button>

    <button class="tarjeta" onclick="elegirIdioma('en')">
      <span class="icono">🇺🇸</span>
      <span><span class="nombre">English</span><br><span class="detalle">Continue in English</span></span>
    </button>
  </section>

  <!-- ══ 2 · Acceso ═════════════════════════════════════════════════════ -->
  <section class="pantalla" id="p-acceso">
    <h1 data-t="acceso_titulo"></h1>
    <p class="sub" data-t="acceso_sub"></p>

    <label for="a-numero" data-t="acceso_numero"></label>
    <input type="tel" id="a-numero" inputmode="numeric" maxlength="4" autocomplete="off"
           placeholder="0000" oninput="alEscribirNumero()">

    <label for="a-nombre" data-t="acceso_nombre"></label>
    <input type="text" id="a-nombre" autocomplete="name" placeholder="" oninput="limpiarError()">

    <div class="error" id="a-error"></div>

    <button class="btn" id="a-btn" style="margin-top:22px" onclick="entrar()" data-t="acceso_btn"></button>
    <p class="pie" data-t="acceso_ayuda"></p>
  </section>

  <!-- ══ 3 · Elegir tipo de reporte ═════════════════════════════════════ -->
  <section class="pantalla" id="p-tipo">
    <h1 data-t="tipo_titulo"></h1>
    <p class="sub" data-t="tipo_sub"></p>

    <button class="tarjeta" onclick="elegirTipo('hse')">
      <span class="icono">⚠️</span>
      <span><span class="nombre" data-t="tipo_hse"></span><br>
            <span class="detalle" data-t="tipo_hse_detalle"></span></span>
    </button>

    <button class="tarjeta" onclick="elegirTipo('vehiculo')">
      <span class="icono">🚗</span>
      <span><span class="nombre" data-t="tipo_vehiculo"></span><br>
            <span class="detalle" data-t="tipo_vehiculo_detalle"></span></span>
    </button>

    <button class="btn texto" onclick="salir()" data-t="salir"></button>
  </section>

  <!-- ══ 4 · Formulario de HSE Observation / Incident ═══════════════════ -->
  <section class="pantalla" id="p-hse">
    <div class="pasos" id="hse-pasos"><span></span><span></span><span></span></div>
    <div class="paso-de" id="hse-paso-de"></div>
    <h1 id="hse-titulo"></h1>

    <!-- ── Paso 1 · Detalles del incidente (preguntas 1 a 7) ── -->
    <div class="hse-paso" id="hse-p1">
      <label for="h-nombre">1 · <span data-t="h_q1"></span> <span class="obligatorio">*</span></label>
      <input type="text" id="h-nombre" autocomplete="name">

      <label for="h-fecha">2 · <span data-t="h_q2"></span> <span class="obligatorio">*</span></label>
      <input type="date" id="h-fecha">

      <label for="h-hora">3 · <span data-t="h_q3"></span> <span class="obligatorio">*</span></label>
      <input type="time" id="h-hora">

      <label for="h-departamento">4 · <span data-t="h_q4"></span> <span class="obligatorio">*</span></label>
      <select id="h-departamento" onchange="alCambiarDepartamento()"></select>

      <!-- País → Sitio → Cliente. Cada uno se habilita cuando el anterior
           está contestado, para que no se puedan combinar datos imposibles. -->
      <label for="h-pais">6 · <span data-t="h_q6"></span> <span class="obligatorio">*</span></label>
      <select id="h-pais" onchange="alCambiarPais()"></select>

      <label for="h-sitio">7 · <span data-t="h_q7"></span> <span class="obligatorio">*</span></label>
      <select id="h-sitio" onchange="alCambiarSitio()"></select>
      <div class="ayuda" id="h-sitio-ayuda" data-t="h_elige_pais"></div>

      <label for="h-cliente">5 · <span data-t="h_q5"></span> <span class="obligatorio">*</span></label>
      <select id="h-cliente" onchange="alCambiarCliente()"></select>
      <input type="text" id="h-cliente-texto" style="display:none" oninput="limpiarErrorHse()">
      <div class="ayuda" id="h-cliente-ayuda" data-t="h_elige_sitio"></div>
    </div>

    <!-- ── Paso 2 · Qué ocurrió (preguntas 8 y 9) ── -->
    <div class="hse-paso" id="hse-p2" style="display:none">
      <label for="h-clasificacion">8 · <span data-t="h_q8"></span> <span class="obligatorio">*</span></label>
      <select id="h-clasificacion" onchange="alCambiarClasificacion()"></select>
      <div id="h-clasif-otro-caja" style="display:none">
        <label for="h-clasif-otro" data-t="h_cual"></label>
        <input type="text" id="h-clasif-otro">
      </div>

      <label for="h-descripcion">9 · <span data-t="h_q9"></span> <span class="obligatorio">*</span></label>
      <textarea id="h-descripcion"></textarea>
      <div class="ayuda" data-t="h_q9_ayuda"></div>
    </div>

    <!-- ── Paso 3 · Medidas, categoría de peligro y evidencia (10, 11, 12) ── -->
    <div class="hse-paso" id="hse-p3" style="display:none">
      <label>10 · <span data-t="h_q10"></span></label>
      <div class="ayuda" style="margin:0 0 9px" data-t="h_q10_ayuda"></div>
      <div class="opciones" id="h-acciones"></div>
      <div id="h-accion-otro-caja" style="display:none">
        <label for="h-accion-otro" data-t="h_cual"></label>
        <input type="text" id="h-accion-otro">
      </div>

      <label>11 · <span data-t="h_q11"></span> <span class="obligatorio">*</span></label>
      <div class="ayuda" style="margin:0 0 4px" data-t="h_q11_ayuda"></div>
      <div class="acordeon" id="h-peligros"></div>
      <div class="elegido-caja" id="h-peligro-elegido" style="display:none"></div>

      <label>12 · <span data-t="h_q12"></span></label>
      <div class="ayuda" style="margin:0" data-t="h_q12_ayuda"></div>
      <div class="fotos" id="h-fotos"></div>
      <div class="botones-foto">
        <button class="btn" onclick="document.getElementById('h-camara').click()" data-t="tomar_foto"></button>
        <button class="btn secundario" onclick="document.getElementById('h-galeria').click()" data-t="elegir_foto"></button>
      </div>
      <input type="file" id="h-camara" accept="image/*" capture="environment" onchange="alElegirFoto(this)">
      <input type="file" id="h-galeria" accept="image/*" multiple onchange="alElegirFoto(this)">
    </div>

    <div class="error" id="h-error"></div>

    <div class="fila-botones">
      <button class="btn secundario" id="h-atras" onclick="hsePasoAtras()" data-t="atras"></button>
      <button class="btn" id="h-siguiente" onclick="hsePasoSiguiente()" data-t="siguiente"></button>
    </div>
    <button class="btn texto" onclick="cancelarHse()" data-t="cancelar"></button>
  </section>

  <!-- ══ 5 · Reporte enviado ════════════════════════════════════════════ -->

function pintarTextos() {
  document.documentElement.lang = IDIOMA || 'en';

  document.querySelectorAll('[data-t]').forEach(function (el) {

  if (cliTexto) cliTexto.placeholder = t('h_q5');

  if (btn) {
    btn.style.display = IDIOMA ? '' : 'none';
    btn.textContent = (IDIOMA === 'es') ? 'EN' : 'ES';
  }

  pintarEstado();
}

function ir(id) {
  document.querySelectorAll('.pantalla').forEach(function (s) {
    s.classList.remove('activa');
  });
  const destino = document.getElementById(id);
  if (destino) destino.classList.add('activa');

// ══════════════════════════════════════════════════════════════════════════
// 6 · LLAMADAS A LA API
// ══════════════════════════════════════════════════════════════════════════

async function api(accion, extra) {
  const cuerpo = Object.assign({ action: accion, lang: IDIOMA || 'en' }, extra || {});

  const r = await fetch(API, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': CONFIG.ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.ANON_KEY,
    },
    body: JSON.stringify(cuerpo),
  });

  let datos = null;
  try { datos = await r.json(); } catch (e) { datos = null; }

  if (!datos || typeof datos !== 'object') {
    const e = new Error('respuesta-ilegible');
    e.http = r.status;
    throw e;
  }

  // El estado HTTP viaja con la respuesta. Sirve para distinguir un rechazo
  // legítimo del servidor (llave mala, función caída) de un "no coincide".
  datos.__http = r.status;
  return datos;
}


// ══════════════════════════════════════════════════════════════════════════
// 7 · ACCESO
// ══════════════════════════════════════════════════════════════════════════

function limpiarError() {
  document.getElementById('a-error').classList.remove('visible');
}

function alEscribirNumero() {
  const campo = document.getElementById('a-numero');
  campo.value = campo.value.replace(/\D/g, '').slice(0, 4);
  limpiarError();
}

// Muestra un texto ya armado, sin pasar por el diccionario.
function mostrarTexto(texto) {
  const caja = document.getElementById('a-error');
  caja.textContent = texto;
  caja.classList.add('visible');
}

// Saca del cuerpo de la respuesta algo que un administrador pueda buscar.
function detalleServidor(r) {
  const msg = r && (r.error || r.message || r.msg || r.error_description);
  const http = r && r.__http ? 'HTTP ' + r.__http : '';
  if (msg && http) return http + ' · ' + msg;
  return msg || http || 'sin detalle';
}

function mostrarError(clave) {
  const caja = document.getElementById('a-error');
  caja.textContent = t(clave);
  caja.classList.add('visible');
}

async function entrar() {
  const numero = (document.getElementById('a-numero').value || '').trim();
  const nombre = (document.getElementById('a-nombre').value || '').trim();

  if (!/^[1-9][0-9]{3}$/.test(numero) || nombre.length < 3) {
    mostrarError('err_incompleto');
    return;
  }

  if (!navigator.onLine) {
    mostrarError('err_sin_red');
    return;
  }

  const boton = document.getElementById('a-btn');
  boton.disabled = true;
  boton.textContent = t('entrando');

  try {
    const r = await api('login', { employee_no: numero, full_name: nombre });

    if (!r.ok) {
      if (r.motivo === 'INACTIVO')             mostrarError('err_inactivo');
      else if (r.motivo === 'BLOQUEADO')       mostrarError('err_bloqueado');
      else if (r.motivo === 'NO_COINCIDE' ||
               r.motivo === 'DATOS_INVALIDOS') mostrarError('err_no_coincide');
      else {
        // No hubo veredicto de acceso: el problema es del servidor o de la
        // configuración. Decirle "tu nombre no coincide" sería mentirle y
        // dejaría a la persona buscando en el lugar equivocado.
        mostrarTexto(t('err_config') + ' ' + detalleServidor(r));
      }
      return;
    }

    SESION = r.empleado;
    localStorage.setItem('spie_sesion', JSON.stringify(SESION));

    // Si el empleado tiene idioma guardado y todavía no había elegido uno
    // en este teléfono, se respeta el suyo.
    if (SESION.lang && !localStorage.getItem('spie_idioma_manual')) {
      if (SESION.lang !== IDIOMA && TEXTOS[SESION.lang]) {
        IDIOMA = SESION.lang;
        localStorage.setItem('spie_idioma', IDIOMA);
        pintarTextos();
      }
    }

    entrarAlPanel();
    precargarCatalogos();

  } catch (e) {
    mostrarError(navigator.onLine ? 'err_servidor' : 'err_sin_red');
  } finally {
    boton.disabled = false;
    boton.textContent = t('acceso_btn');
  }
}

function entrarAlPanel() {
  document.getElementById('cabecera-quien').textContent =
    SESION.full_name + ' · ' + SESION.employee_no;
  ir('p-tipo');
}

function salir() {
  SESION = null;
  localStorage.removeItem('spie_sesion');
  document.getElementById('cabecera-quien').textContent = '';
  document.getElementById('a-nombre').value = '';
  ir('p-acceso');
}

function arrancarSesion() {
  const guardada = localStorage.getItem('spie_sesion');
  if (guardada) {
    try {
      SESION = JSON.parse(guardada);
      document.getElementById('a-numero').value = SESION.employee_no || '';
      document.getElementById('a-nombre').value = SESION.full_name || '';
      entrarAlPanel();
      precargarCatalogos();
      return;
    } catch (e) { /* si está corrupta, se pide otra vez */ }
  }
  ir('p-acceso');
}

// 8 · TIPO DE REPORTE
// ══════════════════════════════════════════════════════════════════════════

async function elegirTipo(tipo) {
  TIPO = tipo;

  const revisar = (tipo === 'hse') ? queFaltaHse : queFaltaVehiculo;

  if (revisar(CATALOGOS)) await precargarCatalogos();

  const falta = revisar(CATALOGOS);
  if (falta) {
    const detalle = (falta === 'respuesta del servidor' && ULTIMO_ERROR_CATALOGOS)
      ? falta + ' → ' + ULTIMO_ERROR_CATALOGOS
      : falta;
    alert(t('err_sin_catalogos').replace('{detalle}', detalle));
    return;
  }

  if (tipo === 'hse') abrirHse();
  else abrirVehiculo();
}

  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function ahoraLocal() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

function abrirHse() {
  HSE = {
    departamento: SESION.department_code || '',
    pais:         SESION.country_code || 'US',
    site_id:      null,
    cliente:      '',
    clasificacion: '',
    acciones:     [],
    peligro:      '',
    peligro_item: '',
    peligro_abierta: null,
  };
  HSE_FOTOS = [];
  HSE_PASO = 1;

  // Lo que ya sabemos de la persona viene puesto, pero se puede corregir.
  document.getElementById('h-nombre').value        = SESION.full_name || '';
  document.getElementById('h-cliente-texto').value = '';
  document.getElementById('h-descripcion').value   = '';
  document.getElementById('h-clasif-otro').value = '';
  document.getElementById('h-accion-otro').value = '';

}

// Dibuja una lista de opciones (única o múltiple) a partir del catálogo.
function listaOpciones(contenedor, items, multiple, elegidoAhora, alElegir) {
  contenedor.innerHTML = '';
  items.forEach(function (op) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opcion' + (multiple ? ' multiple' : '');
    b.dataset.code = op.code;
    b.innerHTML = '<span class="marca"></span><span></span>';
    b.querySelector('span:last-child').textContent = op.label;
    if (elegidoAhora(op.code)) b.classList.add('elegida');
    b.onclick = function () { alElegir(op.code); };
    contenedor.appendChild(b);
  });
}

function pintarOpcionesHse() {
  const c = CATALOGOS;

  // 4 · Departamento
  llenarSelect('h-departamento', c.hse.departamentos, HSE.departamento, true);

  // 6 · País
  llenarSelect('h-pais',
    c.paises.map((p) => ({ code: p.code, label: (IDIOMA === 'es' ? p.name_es : p.name_en) })),
    HSE.pais, true);

  // 7 · Sitio · depende del país
  pintarSitios();

  // 5 · Cliente · depende del sitio
  pintarClientes();

  // 8 · Clasificación
  llenarSelect('h-clasificacion', c.hse.clasificaciones, HSE.clasificacion, true);

  // 10 · Acciones · la ÚNICA que sigue siendo de botones, porque es la única
  // donde se marcan varias a la vez.
  pintarAcciones();

  // 11 · Categorías de peligro, en acordeón
  pintarPeligros();
}


// Rellena un desplegable. El primer renglón siempre es "elige una opción",
// para que nunca quede contestado por descuido con la primera de la lista.
function llenarSelect(id, items, elegido, conVacio) {
  const sel = document.getElementById(id);
  if (!sel) return;

  sel.innerHTML = '';

  if (conVacio) {
    const v = document.createElement('option');
    v.value = '';
    v.textContent = t('h_elegir');
    sel.appendChild(v);
  }

  (items || []).forEach(function (op) {
    const o = document.createElement('option');
    o.value = op.code;
    o.textContent = op.label;
    sel.appendChild(o);
  });

  sel.value = elegido || '';
  sel.disabled = (items || []).length === 0;
}

// ── Los tres encadenados: país → sitio → cliente ──────────────────────────

function sitiosDelPais() {
  if (!HSE.pais) return [];
  return (CATALOGOS.sitios || []).filter((s) => s.country_code === HSE.pais);
}

function pintarSitios() {
  const lista = sitiosDelPais();
  llenarSelect('h-sitio', lista.map((s) => ({ code: s.id, label: s.name })), HSE.site_id, true);

  const ayuda = document.getElementById('h-sitio-ayuda');
  if (!HSE.pais) {
    ayuda.textContent = t('h_elige_pais');
    ayuda.style.display = '';
  } else {
    ayuda.style.display = 'none';
  }
}

function pintarClientes() {
  const sel   = document.getElementById('h-cliente');
  const texto = document.getElementById('h-cliente-texto');
  const ayuda = document.getElementById('h-cliente-ayuda');

  const sitio = (CATALOGOS.sitios || []).find((s) => s.id === HSE.site_id);
  const clientes = (sitio && sitio.customer) ? [sitio.customer] : [];

  if (clientes.length > 0) {
    sel.style.display = '';
    texto.style.display = 'none';
    llenarSelect('h-cliente', clientes.map((x) => ({ code: x, label: x })), HSE.cliente || clientes[0], false);
    HSE.cliente = document.getElementById('h-cliente').value;
    ayuda.style.display = 'none';
  } else if (HSE.site_id) {
    // El sitio no tiene cliente registrado: se escribe a mano.
    sel.style.display = 'none';
    texto.style.display = '';
    ayuda.style.display = 'none';
  } else {
    sel.style.display = '';
    texto.style.display = 'none';
    llenarSelect('h-cliente', [], '', true);
    ayuda.textContent = t('h_elige_sitio');
    ayuda.style.display = '';
  }
}

function alCambiarDepartamento() {

  limpiarErrorHse();
}

function alCambiarPais() {

}

function alCambiarSitio() {

  limpiarErrorHse();
}

function alCambiarClasificacion() {

// ── Categorías de peligro · acordeón ──────────────────────────────────────
//
// Una lista de las 20 categorías. Al tocar una se despliegan sus peligros
// concretos como etiquetas, y se elige tocando una. Así el peligro se escoge
// en un solo gesto en lugar de dos desplegables encadenados, y se ve de un
// vistazo cuántas opciones tiene cada categoría.

// La clave interna de "Superficies Térmicas" es NN para no meter una Ñ en un
// dato técnico. En pantalla sí se muestra la letra que le corresponde.
function letraDe(code) {
  return (code === 'NN') ? 'Ñ' : code;
}

function peligrosDeCategoria(code) {
  const cat = (code === undefined) ? HSE.peligro : code;
  if (!cat) return [];
  return (CATALOGOS.hse.peligros || []).filter((x) => x.parent_code === cat);
}

function pintarPeligros() {
  const cont = document.getElementById('h-peligros');
  if (!cont) return;
  cont.innerHTML = '';

  (CATALOGOS.hse.categorias || []).forEach(function (cat) {
    const hijos = peligrosDeCategoria(cat.code);
    const abierta = (HSE.peligro_abierta === cat.code);
    const elegida = (HSE.peligro === cat.code && !!HSE.peligro_item);

    const fila = document.createElement('button');
    fila.type = 'button';
    fila.className = 'acor-fila' + (abierta ? ' abierta' : '') + (elegida ? ' con-eleccion' : '');

    const letra = document.createElement('span');
    letra.className = 'letra';
    letra.textContent = letraDe(cat.code);

    const nombre = document.createElement('span');
    nombre.className = 'acor-nombre';
    nombre.textContent = cat.label;

    const cuenta = document.createElement('span');
    cuenta.className = 'acor-cuenta';
    cuenta.textContent = elegida ? '✓' : String(hijos.length);

    const flecha = document.createElement('span');
    flecha.className = 'acor-flecha';
    flecha.textContent = abierta ? '▲' : '▼';

    fila.appendChild(letra);
    fila.appendChild(nombre);
    fila.appendChild(cuenta);
    fila.appendChild(flecha);
    fila.onclick = function () { abrirCategoria(cat.code); };
    cont.appendChild(fila);

    const cuerpo = document.createElement('div');
    cuerpo.className = 'acor-cuerpo' + (abierta ? ' abierto' : '');
    hijos.forEach(function (h) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (HSE.peligro_item === h.code ? ' elegido' : '');
      chip.textContent = h.label;
      chip.onclick = function (e) { e.stopPropagation(); elegirPeligro(cat.code, h.code); };
      cuerpo.appendChild(chip);
    });
    cont.appendChild(cuerpo);
  });

  pintarPeligroElegido();
}

// Solo una categoría abierta a la vez: con 20, tenerlas todas abiertas
// convierte la pantalla en una lista interminable.
function abrirCategoria(code) {
  HSE.peligro_abierta = (HSE.peligro_abierta === code) ? null : code;
  pintarPeligros();
  limpiarErrorHse();
}

function elegirPeligro(catCode, itemCode) {
  HSE.peligro = catCode;
  HSE.peligro_item = itemCode;
  HSE.peligro_abierta = catCode;
  pintarPeligros();
  limpiarErrorHse();
}

function pintarPeligroElegido() {
  const caja = document.getElementById('h-peligro-elegido');
  if (!caja) return;

  if (!HSE.peligro || !HSE.peligro_item) { caja.style.display = 'none'; return; }

  const cat  = (CATALOGOS.hse.categorias || []).find((x) => x.code === HSE.peligro);
  const item = (CATALOGOS.hse.peligros || []).find((x) => x.code === HSE.peligro_item);
  if (!cat || !item) { caja.style.display = 'none'; return; }

  caja.innerHTML = '';
  const etq = document.createElement('b');
  etq.textContent = t('h_elegido');
  const txt = document.createElement('span');
  txt.textContent = cat.label + ' → ' + item.label;
  caja.appendChild(etq);
  caja.appendChild(txt);
  caja.style.display = '';
}
// Solo la lista de acciones. Repintar el formulario entero al marcar una
// acción borraba los desplegables ya contestados.
function pintarAcciones() {
  const c = CATALOGOS;
  listaOpciones(
    document.getElementById('h-acciones'),
    c.hse.acciones, true,
    (code) => HSE.acciones.indexOf(code) !== -1,
    (code) => {
      const i = HSE.acciones.indexOf(code);
      if (i === -1) HSE.acciones.push(code); else HSE.acciones.splice(i, 1);
      pintarAcciones();
      const hayOtra = c.hse.acciones.some((x) => x.is_other && HSE.acciones.indexOf(x.code) !== -1);
      document.getElementById('h-accion-otro-caja').style.display = hayOtra ? '' : 'none';
      limpiarErrorHse();
    }
  );

function alCambiarCliente() {
  HSE.cliente = document.getElementById('h-cliente').value;
  limpiarErrorHse();
}

function escaparHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}


// ── Pasos ─────────────────────────────────────────────────────────────────

function hsePintarPaso() {
  for (let i = 1; i <= HSE_PASOS; i++) {
    document.getElementById('hse-p' + i).style.display = (i === HSE_PASO) ? '' : 'none';
  }

  const barras = document.querySelectorAll('#hse-pasos span');
  barras.forEach(function (b, i) { b.classList.toggle('hecho', i < HSE_PASO); });

  document.getElementById('hse-paso-de').textContent =
    t('h_paso').replace('{n}', HSE_PASO).replace('{total}', HSE_PASOS);
  document.getElementById('hse-titulo').textContent = t('h_paso' + HSE_PASO);

  document.getElementById('h-atras').style.display = (HSE_PASO === 1) ? 'none' : '';
  document.getElementById('h-siguiente').textContent =
    (HSE_PASO === HSE_PASOS) ? t('enviar') : t('siguiente');

  window.scrollTo(0, 0);
}

function limpiarErrorHse() {
  document.getElementById('h-error').classList.remove('visible');
}

function errorHse(texto) {
  const caja = document.getElementById('h-error');
  caja.textContent = texto;
  caja.classList.add('visible');
  caja.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function falta(nombreClave) {
  errorHse(t('err_falta').replace('{campo}', t(nombreClave)));
  return false;
}

function hsePasoValido() {
  const v = (id) => (document.getElementById(id).value || '').trim();

  if (HSE_PASO === 1) {
    if (!v('h-nombre'))      return falta('h_q1');
    if (!v('h-fecha'))       return falta('h_q2');
    if (v('h-fecha') > hoyLocal()) { errorHse(t('err_fecha_futura')); return false; }
    if (!v('h-hora'))        return falta('h_q3');
    if (!HSE.departamento)   return falta('h_q4');
    if (!HSE.pais)           return falta('h_q6');
    if (!HSE.site_id)        return falta('h_q7');
    if (!clienteElegido())   return falta('h_q5');
    return true;
  }

  if (HSE_PASO === 2) {
    if (!HSE.clasificacion)  return falta('h_q8');
    const esOtra = CATALOGOS.hse.clasificaciones.some(
      (x) => x.code === HSE.clasificacion && x.is_other);
    if (esOtra && !v('h-clasif-otro')) return falta('h_cual');
    if (!v('h-descripcion')) return falta('h_q9');
    return true;
  }

  if (HSE_PASO === 3) {
    if (!HSE.peligro || !HSE.peligro_item) return falta('h_q11');
    const hayOtra = CATALOGOS.hse.acciones.some(
      (x) => x.is_other && HSE.acciones.indexOf(x.code) !== -1);
    if (hayOtra && !v('h-accion-otro')) return falta('h_cual');
    return true;
  }

  return true;
}

function hsePasoSiguiente() {
  limpiarErrorHse();
  if (!hsePasoValido()) return;

  if (HSE_PASO < HSE_PASOS) {
    HSE_PASO++;
    hsePintarPaso();
  } else {
    enviarHse();
  }
}

function hsePasoAtras() {
  limpiarErrorHse();
  if (HSE_PASO > 1) { HSE_PASO--; hsePintarPaso(); }
}

function cancelarHse() {
  HSE = null;
  HSE_FOTOS = [];
  ir('p-tipo');
}


// ── Fotos ─────────────────────────────────────────────────────────────────

// Se reduce la imagen antes de guardarla: una foto de teléfono pesa varios
// megas y por red de parque eólico no sube nunca.
function comprimirFoto(archivo, ladoMax, calidad) {
  return new Promise(function (ok, mal) {
    const lector = new FileReader();
    lector.onerror = function () { mal(new Error('lectura')); };
    lector.onload = function () {
      const img = new Image();
      img.onerror = function () { mal(new Error('imagen')); };
      img.onload = function () {
        let { width: w, height: h } = img;
        if (w > ladoMax || h > ladoMax) {
          if (w >= h) { h = Math.round(h * ladoMax / w); w = ladoMax; }
          else        { w = Math.round(w * ladoMax / h); h = ladoMax; }
        }
        const lienzo = document.createElement('canvas');
        lienzo.width = w; lienzo.height = h;
        lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = lienzo.toDataURL('image/jpeg', calidad);
        ok({
          nombre: (archivo.name || 'foto.jpg').replace(/\.[^.]+$/, '') + '.jpg',
          mime: 'image/jpeg',
          base64: url.split(',')[1],
          vista: url,
        });
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

async function alElegirFoto(entrada) {
  const archivos = Array.from(entrada.files || []);
  entrada.value = '';           // para poder volver a elegir la misma
  limpiarErrorHse();

  for (const a of archivos) {
    if (HSE_FOTOS.length >= 4) { errorHse(t('err_max_fotos')); break; }
    if (a.size > 10 * 1024 * 1024) { errorHse(t('err_foto_grande')); continue; }
    try {
      HSE_FOTOS.push(await comprimirFoto(a, 1600, 0.7));
    } catch (e) { /* si una imagen falla, se sigue con las demás */ }
  }
  pintarFotos();
}

function quitarFoto(i) {
  HSE_FOTOS.splice(i, 1);
  pintarFotos();
  limpiarErrorHse();
}

function pintarFotos() {
  const caja = document.getElementById('h-fotos');
  caja.innerHTML = '';
  HSE_FOTOS.forEach(function (f, i) {
    const d = document.createElement('div');
    d.className = 'foto';
    const img = document.createElement('img');
    img.src = f.vista;
    img.alt = f.nombre;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '×';
    b.onclick = function () { quitarFoto(i); };
    d.appendChild(img);
    d.appendChild(b);
    caja.appendChild(d);
  });
}


// ── Envío ─────────────────────────────────────────────────────────────────

// El cliente sale del desplegable, o del campo de texto si ese sitio todavía
// no tiene cliente registrado.
function clienteElegido() {
  const sel = document.getElementById('h-cliente');
  if (sel && sel.style.display !== 'none') return (sel.value || '').trim();
  return (document.getElementById('h-cliente-texto').value || '').trim();
}

function armarReporteHse() {
  const v = (id) => (document.getElementById(id).value || '').trim();

  return {
    employee_no:          SESION.employee_no,
    reporter_name:        v('h-nombre'),
    occurred_date:        v('h-fecha'),
    occurred_time:        v('h-hora'),
    department_code:      HSE.departamento,
    customer:             clienteElegido(),
    country_code:         HSE.pais,
    site_id:              HSE.site_id || null,
    site_other:           null,
    classification_code:  HSE.clasificacion,
    classification_other: v('h-clasif-otro') || null,
    description:          v('h-descripcion'),
    action_codes:         HSE.acciones.slice(),
    action_other:         v('h-accion-otro') || null,
    hazard_category_code: HSE.peligro,
    hazard_item_code:     HSE.peligro_item || null,
    tz:                   ZONA,
    lang:                 IDIOMA,
  };
}

// Manda el reporte y después sus fotos. Se usa igual desde el botón de enviar
// y desde la cola cuando vuelve la señal, para que no haya dos caminos que
// puedan comportarse distinto.
async function mandarHse(reporte, fotos) {
  const r = await api('hse-crear', { reporte: reporte });
  if (!r.ok) throw new Error(r.error || 'error');

  const folio = r.reporte.report_code;

  for (const f of (fotos || [])) {
    try {
      await api('adjuntar', {
        report_code: folio,
        file_name: f.nombre,
        mime_type: f.mime,
        base64: f.base64,
      });
    } catch (e) {
      // El reporte ya quedó guardado; una foto que falle no lo tira abajo.
      console.warn('No se pudo subir una foto:', e);
    }
  }
  return folio;
}

async function enviarHse() {
  const boton = document.getElementById('h-siguiente');
  const reporte = armarReporteHse();
  const fotos = HSE_FOTOS.map((f) => ({ nombre: f.nombre, mime: f.mime, base64: f.base64 }));

  // Sin señal: a la cola, y se avisa con claridad de que no se ha ido todavía.
  if (!navigator.onLine) {
    await colaGuardar({
      id: 'hse-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      tipo: 'hse',
      reporte: reporte,
      fotos: fotos,
    });
    mostrarListo(null);
    return;
  }

  boton.disabled = true;
  boton.textContent = t('enviando');

  try {
    const folio = await mandarHse(reporte, fotos);
    mostrarListo(folio);
  } catch (e) {
    errorHse(t('err_envio') + ' ' + (e.message || ''));
  } finally {
    boton.disabled = false;
    boton.textContent = t('enviar');
  }
}

function mostrarListo(folio) {
  document.getElementById('listo-titulo').textContent =
    folio ? t('listo_titulo') : t('listo_cola');
  document.getElementById('listo-folio').textContent = folio || '';
  document.getElementById('listo-detalle').textContent =
    folio ? t('listo_detalle') : t('listo_cola_det');

  HSE = null;
  HSE_FOTOS = [];
  pintarEstado();
  ir('p-listo');
}


// ══════════════════════════════════════════════════════════════════════════
// 8c · INSPECCIÓN DE VEHÍCULO · las 47 preguntas del formulario
//
// El formulario NO está escrito a mano aquí: se dibuja a partir del catálogo
// que manda la base de datos. Si mañana cambia el texto de una pregunta, o se
// añade una, la app la muestra sola. Lo único que vive en este archivo es cómo
// se ve y cuándo deja pasar al siguiente paso.
//
// Cinco pasos, uno por sección del formulario:
//   1 · Datos del vehículo   2 · Exterior   3 · Interior
//   4 · Funcionamiento       5 · Bajo el cofre y comentarios finales
//
// Las 34 preguntas de sí/no se contestan una por una, a propósito: no hay
// botón de "todo bien". Las 5 fotos son obligatorias.
// ══════════════════════════════════════════════════════════════════════════

const VEH_PASOS = 5;

// Qué secciones del catálogo salen en cada paso.
const VEH_MAPA = [
  ['vehicle_data'],
  ['vehicle_exterior'],
  ['vehicle_interior'],
  ['vehicle_operating'],
  ['vehicle_hood', 'vehicle_comments'],
];

let VEH_PASO = 1;
let VEH = null;        // { pais, site_id, respuestas:{}, comentarios:{} }
let VEH_FOTOS = {};    // { PHOTO_FRONT: {nombre, mime, base64, vista}, … }
let VEH_SLOT = null;   // a qué ranura va la foto que se está eligiendo
let VEH_NUM = {};      // código → número de pregunta (1 … 47)
let VEH_PREG = {};     // código → la pregunta completa

function seccionVeh(clave) {
  return ((CATALOGOS && CATALOGOS.vehiculo) || []).find((s) => s.key === clave) || null;
}

function seccionesDelPaso(paso) {
  return VEH_MAPA[paso - 1].map(seccionVeh).filter(Boolean);
}

// Numera las 47 preguntas de corrido, en el orden del formulario.
function numerarVeh() {
  VEH_NUM = {};
  VEH_PREG = {};
  let n = 0;
  VEH_MAPA.forEach(function (claves) {
    claves.forEach(function (clave) {
      const sec = seccionVeh(clave);
      if (!sec) return;
      (sec.preguntas || []).forEach(function (p) {
        n += 1;
        VEH_NUM[p.code] = n;
        VEH_PREG[p.code] = p;
      });
    });
  });
}

// Una respuesta es deficiencia según la polaridad de la pregunta: en casi
// todas, "No" es lo malo; en "¿hay fuga de líquidos?" lo malo es el "Sí".
function esDeficiencia(preg, valor) {
  if (valor === undefined || valor === null) return false;
  return preg.yes_is_bad ? valor === true : valor === false;
}

function deficienciasDeSeccion(sec) {
  let n = 0;
  (sec.preguntas || []).forEach(function (p) {
    if (p.answer_type === 'yesno' && esDeficiencia(p, VEH.respuestas[p.code])) n += 1;
  });
  return n;
}

function deficienciasDelPaso(paso) {
  return seccionesDelPaso(paso).reduce((n, sec) => n + deficienciasDeSeccion(sec), 0);
}

function abrirVehiculo() {
  VEH = {
    pais: SESION.country_code || 'US',
    site_id: null,
    respuestas: {},
    comentarios: {},
  };
  VEH_FOTOS = {};
  VEH_SLOT = null;
  VEH_PASO = 1;
  numerarVeh();
  vehPintarPaso();
  ir('p-vehiculo');
}

function cancelarVeh() {
  VEH = null;
  VEH_FOTOS = {};
  ir('p-tipo');
}

// "Falta contestar: …", con el mismo texto que usa el formulario de HSE.
// Ojo: la función falta() de HSE recibe una CLAVE de texto; esta recibe la
// etiqueta ya traducida, porque las preguntas del vehículo vienen de la base.
function faltaVeh(campo) {
  return t('err_falta').replace('{campo}', campo);
}

function errorVeh(texto) {
  const caja = document.getElementById('v-error');
  caja.textContent = texto;
  caja.classList.add('visible');
  caja.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function limpiarErrorVeh() {
  document.getElementById('v-error').classList.remove('visible');
}


// ── Dibujo del paso ───────────────────────────────────────────────────────

function vehPintarPaso() {
  const pasos = document.getElementById('veh-pasos').children;
  for (let i = 0; i < pasos.length; i++) {
    pasos[i].className = (i < VEH_PASO) ? 'hecho' : '';
  }
  document.getElementById('veh-paso-de').textContent = t('v_paso').replace('{n}', VEH_PASO);

  const secs = seccionesDelPaso(VEH_PASO);
  document.getElementById('veh-titulo').textContent = secs.length ? secs[0].titulo : '';

  const cuerpo = document.getElementById('veh-cuerpo');
  cuerpo.innerHTML = '';

  secs.forEach(function (sec, i) {
    // El título de la primera sección ya está arriba, en el h1.
    if (i > 0) {
      const h = document.createElement('div');
      h.className = 'veh-seccion';
      h.textContent = sec.titulo;
      cuerpo.appendChild(h);
    }
    (sec.preguntas || []).forEach(function (p) {
      cuerpo.appendChild(pintarPreguntaVeh(p));
    });
  });

  if (VEH_PASO === 1) cuerpo.appendChild(pintarSitioVeh());

  document.getElementById('v-atras').style.visibility = (VEH_PASO === 1) ? 'hidden' : 'visible';
  document.getElementById('v-siguiente').textContent =
    (VEH_PASO === VEH_PASOS) ? t('v_enviar') : t('siguiente');

  actualizarResumenVeh();
  limpiarErrorVeh();
  window.scrollTo(0, 0);
}

function pintarPreguntaVeh(p) {
  if (p.answer_type === 'yesno')    return filaSiNo(p);
  if (p.answer_type === 'photo')    return ranuraFoto(p);
  if (p.answer_type === 'longtext') return cajaComentario(p);
  return campoDato(p);
}

function etiquetaVeh(p, obligatoria) {
  const l = document.createElement('div');
  l.className = 'pregunta-texto';
  const n = document.createElement('span');
  n.className = 'pregunta-num';
  n.textContent = VEH_NUM[p.code] + ' · ';
  l.appendChild(n);
  l.appendChild(document.createTextNode(p.label));
  if (obligatoria) {
    const r = document.createElement('span');
    r.className = 'obligatorio';
    r.textContent = ' *';
    l.appendChild(r);
  }
  return l;
}

function filaSiNo(p) {
  const d = document.createElement('div');
  d.className = 'pregunta';
  d.id = 'veh-q-' + p.code;
  d.appendChild(etiquetaVeh(p, true));

  const g = document.createElement('div');
  g.className = 'sino';
  [[t('v_si'), true], [t('v_no'), false]].forEach(function (par) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = par[0];
    const elegido = VEH.respuestas[p.code] === par[1];
    b.className = 'sino-btn' + (elegido ? ' elegido' : '') +
                  (elegido && esDeficiencia(p, par[1]) ? ' malo' : '');
    b.onclick = function () { responderVeh(p.code, par[1]); };
    g.appendChild(b);
  });
  d.appendChild(g);
  return d;
}

// Se redibuja SOLO la pregunta tocada. Redibujar el paso entero borraría lo
// que la persona lleve escrito en las cajas de comentarios.
function responderVeh(code, valor) {
  VEH.respuestas[code] = valor;
  const fila = document.getElementById('veh-q-' + code);
  if (fila && fila.parentNode) fila.parentNode.replaceChild(filaSiNo(VEH_PREG[code]), fila);
  actualizarResumenVeh();
  limpiarErrorVeh();
}

function cajaComentario(p) {
  const d = document.createElement('div');
  d.className = 'pregunta';
  d.id = 'veh-q-' + p.code;
  d.appendChild(etiquetaVeh(p, false));

  const ta = document.createElement('textarea');
  ta.id = 'v-txt-' + p.code;
  ta.value = VEH.comentarios[p.code] || '';
  ta.oninput = function () {
    VEH.comentarios[p.code] = ta.value;
    limpiarErrorVeh();
  };
  d.appendChild(ta);
  return d;
}

function campoDato(p) {
  const d = document.createElement('div');
  d.className = 'pregunta';
  d.id = 'veh-q-' + p.code;
  d.appendChild(etiquetaVeh(p, true));

  const i = document.createElement('input');
  i.id = 'v-' + p.code;
  i.type = (p.answer_type === 'number') ? 'number'
         : (p.answer_type === 'date')   ? 'date' : 'text';
  if (p.answer_type === 'number') { i.min = '0'; i.inputMode = 'numeric'; }
  if (p.code === 'DRIVER_NAME')   { i.autocomplete = 'name'; i.value = SESION.full_name || ''; }
  if (p.code === 'INSPECTION_DATE') i.value = hoyLocal();
  if (p.code === 'LICENSE_PLATE') { i.placeholder = t('v_placa_ph'); i.autocapitalize = 'characters'; }
  VEH.datos = VEH.datos || {};
  if (VEH.datos[p.code] !== undefined) i.value = VEH.datos[p.code];
  else VEH.datos[p.code] = i.value;      // lo prellenado también es un dato

  i.oninput = function () {
    VEH.datos[p.code] = i.value;
    limpiarErrorVeh();
  };
  d.appendChild(i);
  return d;
}

// País → sitio, igual que en el formulario de HSE.
function pintarSitioVeh() {
  const caja = document.createElement('div');

  const l1 = document.createElement('label');
  l1.textContent = t('v_pais');
  const r1 = document.createElement('span');
  r1.className = 'obligatorio'; r1.textContent = ' *';
  l1.appendChild(r1);
  const selPais = document.createElement('select');
  selPais.id = 'v-pais';
  ((CATALOGOS && CATALOGOS.paises) || []).forEach(function (c) {
    const o = document.createElement('option');
    o.value = c.code;
    o.textContent = (IDIOMA === 'es') ? c.name_es : c.name_en;
    if (c.code === VEH.pais) o.selected = true;
    selPais.appendChild(o);
  });
  selPais.onchange = function () {
    VEH.pais = selPais.value;
    VEH.site_id = null;
    llenarSitiosVeh();
    limpiarErrorVeh();
  };

  const l2 = document.createElement('label');
  l2.textContent = t('v_sitio');
  const r2 = document.createElement('span');
  r2.className = 'obligatorio'; r2.textContent = ' *';
  l2.appendChild(r2);
  const selSitio = document.createElement('select');
  selSitio.id = 'v-sitio';
  selSitio.onchange = function () {
    VEH.site_id = selSitio.value || null;
    limpiarErrorVeh();
  };

  caja.appendChild(l1); caja.appendChild(selPais);
  caja.appendChild(l2); caja.appendChild(selSitio);

  // Se llena después de estar en el documento, para poder buscarlo por id.
  setTimeout(llenarSitiosVeh, 0);
  return caja;
}

function llenarSitiosVeh() {
  const sel = document.getElementById('v-sitio');
  if (!sel) return;
  sel.innerHTML = '';
  const vacio = document.createElement('option');
  vacio.value = '';
  vacio.textContent = t('h_elegir');
  sel.appendChild(vacio);

  ((CATALOGOS && CATALOGOS.sitios) || [])
    .filter((s) => s.country_code === VEH.pais)
    .forEach(function (s) {
      const o = document.createElement('option');
      o.value = s.id;
      o.textContent = s.name;
      if (s.id === VEH.site_id) o.selected = true;
      sel.appendChild(o);
    });
}


// ── Fotos, una por ranura ─────────────────────────────────────────────────

function ranuraFoto(p) {
  const d = document.createElement('div');
  d.className = 'pregunta';
  d.id = 'veh-q-' + p.code;
  d.appendChild(etiquetaVeh(p, true));

  const f = VEH_FOTOS[p.code];
  if (f) {
    const caja = document.createElement('div');
    caja.className = 'foto-slot';
    const img = document.createElement('img');
    img.src = f.vista;
    img.alt = p.label;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '×';
    b.onclick = function () { quitarFotoVeh(p.code); };
    caja.appendChild(img);
    caja.appendChild(b);
    d.appendChild(caja);
  } else {
    const fila = document.createElement('div');
    fila.className = 'botones-foto';
    [['tomar_foto', 'v-camara'], ['elegir_foto', 'v-galeria']].forEach(function (par, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (i === 1 ? ' secundario' : '');
      b.textContent = t(par[0]);
      b.onclick = function () { pedirFotoVeh(p.code, par[1]); };
      fila.appendChild(b);
    });
    d.appendChild(fila);
  }
  return d;
}

function pedirFotoVeh(code, entradaId) {
  VEH_SLOT = code;
  document.getElementById(entradaId).click();
}

async function alElegirFotoVeh(entrada) {
  const archivo = (entrada.files || [])[0];
  entrada.value = '';
  limpiarErrorVeh();
  if (!archivo || !VEH_SLOT) return;

  if (archivo.size > 10 * 1024 * 1024) { errorVeh(t('err_foto_grande')); return; }
  try {
    VEH_FOTOS[VEH_SLOT] = await comprimirFoto(archivo, 1600, 0.7);
  } catch (e) {
    errorVeh(t('err_foto_grande'));
    return;
  }
  repintarRanura(VEH_SLOT);
  VEH_SLOT = null;
}

function quitarFotoVeh(code) {
  delete VEH_FOTOS[code];
  repintarRanura(code);
  limpiarErrorVeh();
}

function repintarRanura(code) {
  const fila = document.getElementById('veh-q-' + code);
  if (fila && fila.parentNode) fila.parentNode.replaceChild(ranuraFoto(VEH_PREG[code]), fila);
}


// ── Resumen de deficiencias del paso ──────────────────────────────────────

function actualizarResumenVeh() {
  const caja = document.getElementById('veh-resumen');
  caja.innerHTML = '';
  if (VEH_PASO === 1) return;

  const n = deficienciasDelPaso(VEH_PASO);
  const d = document.createElement('div');
  if (n === 0) {
    d.className = 'aviso-ok';
    d.textContent = t('v_sin_def');
  } else {
    d.className = 'aviso-def';
    d.textContent = (n === 1) ? t('v_def_una') : t('v_def_varias').replace('{n}', n);
  }
  caja.appendChild(d);
}


// ── Validación ────────────────────────────────────────────────────────────

// Muestra el aviso y lleva la pantalla hasta la pregunta que falta.
function avisarFalta(code, texto) {
  errorVeh(texto);
  const fila = document.getElementById('veh-q-' + code);
  if (fila) fila.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return false;
}

function vehValidarPaso() {
  const secs = seccionesDelPaso(VEH_PASO);

  if (VEH_PASO === 1) {
    const dato = (code) => (((VEH.datos || {})[code]) || '').trim();

    if (!dato('DRIVER_NAME'))   { errorVeh(faltaVeh(VEH_PREG['DRIVER_NAME'].label)); return false; }
    if (!dato('LICENSE_PLATE')) { errorVeh(faltaVeh(VEH_PREG['LICENSE_PLATE'].label)); return false; }

    const odo = dato('ODOMETER');
    if (odo === '' || !/^\d+$/.test(odo)) { errorVeh(t('v_odo_malo')); return false; }

    const fecha = dato('INSPECTION_DATE');
    if (!fecha) { errorVeh(faltaVeh(VEH_PREG['INSPECTION_DATE'].label)); return false; }
    if (fecha > hoyLocal()) { errorVeh(t('v_fecha_futura')); return false; }

    if (!VEH.site_id) { errorVeh(faltaVeh(t('v_sitio'))); return false; }
    return true;
  }

  // Se revisa en el MISMO orden en que la persona ve las preguntas, para que
  // el aviso señale lo primero que le falta y no lo último.
  for (const sec of secs) {
    for (const p of (sec.preguntas || [])) {
      if (p.answer_type === 'yesno' && VEH.respuestas[p.code] === undefined) {
        return avisarFalta(p.code, faltaVeh(VEH_NUM[p.code] + ' · ' + p.label));
      }

      // Una deficiencia sin explicación no le sirve a quien tiene que
      // arreglar el vehículo: el comentario de la sección se vuelve
      // obligatorio en cuanto algo sale mal.
      if (p.answer_type === 'longtext' && p.code !== 'ADDITIONAL_COMMENTS'
          && deficienciasDeSeccion(sec) > 0
          && !((VEH.comentarios[p.code] || '').trim())) {
        return avisarFalta(p.code, t('v_falta_com'));
      }

      if (p.answer_type === 'photo' && !VEH_FOTOS[p.code]) {
        return avisarFalta(p.code, t('v_falta_foto') + p.label);
      }
    }
  }
  return true;
}

function vehPasoAtras() {
  if (VEH_PASO > 1) { VEH_PASO -= 1; vehPintarPaso(); }
}

function vehPasoSiguiente() {
  if (!vehValidarPaso()) return;
  if (VEH_PASO < VEH_PASOS) { VEH_PASO += 1; vehPintarPaso(); return; }
  enviarVehiculo();
}


// ── Envío ─────────────────────────────────────────────────────────────────

function armarInspeccion() {
  const dato = (code) => (((VEH.datos || {})[code]) || '').trim();
  const com = (code) => ((VEH.comentarios[code] || '').trim() || null);

  const respuestas = {};
  Object.keys(VEH_PREG).forEach(function (code) {
    if (VEH_PREG[code].answer_type === 'yesno') respuestas[code] = VEH.respuestas[code];
  });

  return {
    employee_no:     SESION.employee_no,
    driver_name:     dato('DRIVER_NAME'),
    license_plate:   dato('LICENSE_PLATE').toUpperCase(),
    odometer:        Number(dato('ODOMETER')),
    inspection_date: dato('INSPECTION_DATE'),
    site_id:         VEH.site_id || null,
    site_other:      null,
    answers:         respuestas,
    ext_comments:        com('EXT_COMMENTS'),
    int_comments:        com('INT_COMMENTS'),
    ope_comments:        com('OPE_COMMENTS'),
    hood_comments:       com('HOOD_COMMENTS'),
    additional_comments: com('ADDITIONAL_COMMENTS'),
    tz:   ZONA,
    lang: IDIOMA,
  };
}

// Mismo camino desde el botón de enviar y desde la cola, para que no haya dos
// comportamientos distintos.
async function mandarVehiculo(inspeccion, fotos) {
  const r = await api('vehiculo-crear', { inspeccion: inspeccion });
  if (!r.ok) throw new Error(r.error || 'error');

  const folio = r.inspeccion.report_code;

  for (const f of (fotos || [])) {
    try {
      await api('adjuntar', {
        report_code: folio,
        slot: f.slot,
        file_name: f.nombre,
        mime_type: f.mime,
        base64: f.base64,
      });
    } catch (e) {
      console.warn('No se pudo subir una foto de la inspección:', e);
    }
  }
  return folio;
}

async function enviarVehiculo() {
  const boton = document.getElementById('v-siguiente');
  const inspeccion = armarInspeccion();
  const fotos = Object.keys(VEH_FOTOS).map(function (slot) {
    const f = VEH_FOTOS[slot];
    return { slot: slot, nombre: f.nombre, mime: f.mime, base64: f.base64 };
  });

  if (!navigator.onLine) {
    await colaGuardar({
      id: 'veh-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      tipo: 'vehiculo',
      inspeccion: inspeccion,
      fotos: fotos,
    });
    mostrarListoVeh(null);
    return;
  }

  boton.disabled = true;
  boton.textContent = t('enviando');

  try {
    const folio = await mandarVehiculo(inspeccion, fotos);
    mostrarListoVeh(folio);
  } catch (e) {
    errorVeh(t('err_envio') + ' ' + (e.message || ''));
  } finally {
    boton.disabled = false;
    boton.textContent = t('v_enviar');
  }
}

function mostrarListoVeh(folio) {
  document.getElementById('listo-titulo').textContent =
    folio ? t('v_listo_titulo') : t('listo_cola');
  document.getElementById('listo-folio').textContent = folio || '';
  document.getElementById('listo-detalle').textContent =
    folio ? t('v_listo_detalle') : t('listo_cola_det');

  VEH = null;
  VEH_FOTOS = {};
  pintarEstado();
  ir('p-listo');
}


// ══════════════════════════════════════════════════════════════════════════
// 9 · CATÁLOGOS · se guardan para poder llenar el formulario sin señal
// ══════════════════════════════════════════════════════════════════════════

// Los catálogos guardados en el teléfono son de una versión concreta de la
// app. Cuando cambia lo que la app necesita —como al añadir los peligros
// concretos— lo viejo se queda corto, y usarlo deja controles vacíos que el
// usuario no puede rellenar. Por eso NUNCA se da por bueno lo guardado sin
// comprobar antes que trae todo lo que hace falta.
function listaCon(v) {
  return Array.isArray(v) && v.length > 0;
}

// Devuelve QUÉ falta, o null si está todo. Decir "no se pudieron cargar las
// preguntas" sin más deja a la persona sin nada que mirar y a ti sin nada que
// arreglar: el nombre de lo que falta señala el sitio exacto del problema.
function queFaltaHse(c) {
  if (!c || !c.ok)                      return 'respuesta del servidor';
  if (!listaCon(c.paises))              return 'países';
  if (!c.hse)                           return 'preguntas de HSE';
  if (!listaCon(c.hse.departamentos))   return 'departamentos';
  if (!listaCon(c.hse.clasificaciones)) return 'clasificaciones';
  if (!listaCon(c.hse.acciones))        return 'acciones inmediatas';
  if (!listaCon(c.hse.categorias))      return 'categorías de peligro';
  if (!listaCon(c.hse.peligros))        return 'peligros concretos';
  return null;
}

function queFaltaVehiculo(c) {
  if (!c || !c.ok)             return 'respuesta del servidor';
  if (!listaCon(c.vehiculo))   return 'secciones del formulario de vehículo';
  if (c.vehiculo.length !== 6) return 'secciones del vehículo (llegaron ' + c.vehiculo.length + ' de 6)';

  const vacia = c.vehiculo.find((s) => !listaCon(s.preguntas));
  if (vacia) return 'preguntas de la sección ' + vacia.key;
  return null;
}

// Lo mínimo para poder usar la app sin señal. Un problema en el formulario de
// vehículo NO debe dejar sin servicio al de HSE, ni al revés.
function catalogosCompletos(c) {
  return queFaltaHse(c) === null;
}

// Por qué falló la última petición de catálogos. Sin esto, la app solo puede
// decir "no hubo respuesta del servidor", que es justo lo que no ayuda a nadie.
let ULTIMO_ERROR_CATALOGOS = '';

async function precargarCatalogos() {
  // Lo guardado sirve de arranque, pero solo si está completo.
  const guardado = localStorage.getItem('spie_catalogos_' + IDIOMA);
  if (guardado) {
    try {
      const c = JSON.parse(guardado);
      CATALOGOS = catalogosCompletos(c) ? c : null;
      if (!CATALOGOS) localStorage.removeItem('spie_catalogos_' + IDIOMA);
    } catch (e) {
      CATALOGOS = null;
      localStorage.removeItem('spie_catalogos_' + IDIOMA);
    }
  }

  if (!navigator.onLine) return;

  // Con señal se piden SIEMPRE los frescos, aunque ya hubiera guardados.
  try {
    const r = await api('catalogos');

    if (!r || !r.ok) {
      ULTIMO_ERROR_CATALOGOS = detalleServidor(r);
      return;
    }

    ULTIMO_ERROR_CATALOGOS = '';
    if (catalogosCompletos(r)) {
      CATALOGOS = r;
      localStorage.setItem('spie_catalogos_' + IDIOMA, JSON.stringify(r));
    } else {
      CATALOGOS = r;     // sirve para saber QUÉ falta, aunque no se guarde
    }
  } catch (e) {
    ULTIMO_ERROR_CATALOGOS = navigator.onLine
      ? (e.message || 'no se pudo conectar')
      : '';
  }
}


// ══════════════════════════════════════════════════════════════════════════
// 10 · COLA SIN SEÑAL · IndexedDB
//
// localStorage no sirve aquí: las fotos en base64 lo desbordan enseguida.
// Los formularios de los bloques 9 y 10 dejarán aquí los reportes cuando no
// haya red, y esta cola los irá enviando sola en cuanto vuelva la señal.
// ══════════════════════════════════════════════════════════════════════════

const BD_NOMBRE = 'spie-na-hse';
const BD_COLA   = 'pendientes';

function bdAbrir() {
  return new Promise(function (ok, mal) {
    const p = indexedDB.open(BD_NOMBRE, 1);
    p.onupgradeneeded = function () {
      const bd = p.result;
      if (!bd.objectStoreNames.contains(BD_COLA)) {
        bd.createObjectStore(BD_COLA, { keyPath: 'id' });
      }
    };
    p.onsuccess = function () { ok(p.result); };
    p.onerror = function () { mal(p.error); };
  });
}

async function colaGuardar(reporte) {
  const bd = await bdAbrir();
  return new Promise(function (ok, mal) {
    const tx = bd.transaction(BD_COLA, 'readwrite');
    tx.objectStore(BD_COLA).put(reporte);
    tx.oncomplete = function () { ok(true); };
    tx.onerror = function () { mal(tx.error); };
  });
}

async function colaTodos() {
  const bd = await bdAbrir();
  return new Promise(function (ok, mal) {
    const salida = [];
    const tx = bd.transaction(BD_COLA, 'readonly');
    const cur = tx.objectStore(BD_COLA).openCursor();
    cur.onsuccess = function (e) {
      const c = e.target.result;
      if (c) { salida.push(c.value); c.continue(); } else { ok(salida); }
    };
    cur.onerror = function () { mal(cur.error); };
  });
}

async function colaBorrar(id) {
  const bd = await bdAbrir();
  return new Promise(function (ok) {
    const tx = bd.transaction(BD_COLA, 'readwrite');
    tx.objectStore(BD_COLA).delete(id);
    tx.oncomplete = function () { ok(true); };
    tx.onerror = function () { ok(false); };
  });
}

let COLA_TRABAJANDO = false;

async function colaEnviar() {
  if (!navigator.onLine || COLA_TRABAJANDO) return;
  COLA_TRABAJANDO = true;

  try {
    const pendientes = await colaTodos();

    for (const p of pendientes) {
      try {
        if (p.tipo === 'hse') {
          await mandarHse(p.reporte, p.fotos);
          await colaBorrar(p.id);
        } else if (p.tipo === 'vehiculo') {
          await mandarVehiculo(p.inspeccion, p.fotos);
          await colaBorrar(p.id);
        }
      } catch (e) {
        // Si el servidor RECHAZA el reporte (datos inválidos), reintentarlo
        // mil veces no lo va a arreglar: se descarta para no dejar la cola
        // atascada para siempre. Si fue un fallo de red, se conserva.
        if (navigator.onLine && /no válid|not valid|inexistente|vacía|rechaz/i.test(e.message || '')) {
          await colaBorrar(p.id);
          console.warn('Reporte descartado por datos inválidos:', p.id, e.message);
        } else {
          break;   // sigue sin haber red: se reintenta en el próximo aviso
        }
      }
    }
  } finally {
    COLA_TRABAJANDO = false;
  }

  pintarEstado();
}


// ══════════════════════════════════════════════════════════════════════════
// 11 · BARRA DE ESTADO
// ══════════════════════════════════════════════════════════════════════════

async function pintarEstado() {
  const barra = document.getElementById('barra-estado');
  if (!barra) return;

  barra.className = '';
  barra.textContent = '';

  if (!navigator.onLine) {
    barra.className = 'sin-red';
    barra.textContent = t('sin_red');
    return;
  }

  let n = 0;
  try { n = (await colaTodos()).length; } catch (e) { n = 0; }

  if (n > 0) {
    barra.className = 'pendientes';
    barra.textContent = (n === 1)
      ? t('pendientes_uno')
      : t('pendientes_varios').replace('{n}', n);
  }
}


// ══════════════════════════════════════════════════════════════════════════
// 12 · ARRANQUE
// ══════════════════════════════════════════════════════════════════════════

window.addEventListener('online', function () { pintarEstado(); colaEnviar(); });
window.addEventListener('offline', pintarEstado);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) {
      console.warn('Service Worker no registrado:', e);
    });
  });
}

(function arrancar() {
  pintarTextos();

  if (!IDIOMA) {
    ir('p-idioma');            // primera vez en este teléfono
  } else {
    arrancarSesion();
  }

  pintarEstado();
  colaEnviar();
})();
</script>
